# One portrait for each person, keyed by the person's slug.
# The image files are in app/assets/images/people.
#
# Every portrait came from Wikimedia Commons, where it is marked as being in
# the public domain. source_url is the Commons page, which records where the
# image came from. Several portraits are later paintings, drawings or
# engravings, not likenesses made from life; each caption says what it is.

joseph-smith:
  file_name: people/joseph-smith.jpg
  caption: "Joseph Smith. Oil painting, about 1842."
  credit: "Artist uncertain. Original owned by Community of Christ. Via Wikimedia Commons."
  license: Public domain
  source_url: "https://commons.wikimedia.org/wiki/File:Joseph_Smith,_Jr._portrait_owned_by_Joseph_Smith_III.jpg"

