# The longer write-up of each event, by slug (see events.yml).
#
#   background    what led up to it
#   account       what happened; leave a blank line between paragraphs
#   significance  why it matters
#
# DRAFT: written from general knowledge of the standard histories, not yet
# checked line by line. Check every name, number, date and quotation against
# the sources before launch.

# ---------------------------------------------------------------- New York

first-vision:
  background: >-
    The Smith family moved from Vermont to the Palmyra area of western New York
    around 1816 and later cleared a farm just south of the village. The region
    was swept by religious revivals, and the family was divided over which
    church to join. Joseph wrote that the competing claims of the preachers
    left him confused. Reading James 1:5, which invites anyone who lacks wisdom
    to ask God, he decided to pray.
  account: |-
    On a spring morning in 1820, Joseph went alone into the woods near his home and knelt to pray aloud for the first time. He wrote that a dark power seized him and that he could not speak. As he called on God for help, a pillar of light brighter than the sun came down upon him.

    In the light he saw two Personages. One pointed to the other and said, "This is My Beloved Son. Hear Him!" Joseph asked which church he should join and was told to join none of them.

    When he described the vision to a local minister a few days later, the man dismissed it. Joseph said that telling the story brought him ridicule, but that he could not deny what he had seen.
  significance: >-
    Latter-day Saints regard the First Vision as the opening event of the
    Restoration. Joseph Smith left four firsthand accounts, written or
    dictated in 1832, 1835, 1838 and 1842. They differ in emphasis and detail
    and agree on the central experience. The 1838 account is the one published
    in the Pearl of Great Price.

moroni-visits:
  background: >-
    Three years had passed since the First Vision. Joseph, now seventeen,
    worked on the family farm and hired out as a laborer. He wrote that he
    felt weighed down by his own faults. On the night of September 21, 1823,
    he prayed for forgiveness and to know his standing before God.
  account: |-
    A light filled the room and a messenger appeared beside Joseph's bed. He gave his name as Moroni and said that God had a work for Joseph to do. He described a book written on gold plates, buried in a hill not far away, that told of the ancient inhabitants of the Americas and contained the fulness of the gospel. With the plates were stones prepared for translating them.

    Moroni quoted prophecies from the Bible, including Malachi's promise that Elijah would return. He appeared three times that night, repeating the same message and adding warnings. The next day he appeared again as Joseph walked home, worn out, from the fields, and told him to tell his father. Joseph Smith Sr. believed him.

    Joseph went to the hill and found the plates in a stone box under a large rock. Moroni did not let him take them. He was told to come back on the same day each year.
  significance: >-
    The visits began four years of preparation before Joseph Smith received
    the plates, and led to the Book of Mormon. The hill, a few miles south of
    Palmyra, later became known as Cumorah.

joseph-receives-the-plates:
  background: >-
    Joseph returned to the hill each September from 1824 to 1826 and was
    taught by Moroni each time. In those years his older brother Alvin died,
    and Joseph worked away from home to help his family. While boarding in
    Harmony, Pennsylvania, he met Emma Hale. They married on January 18, 1827.
  account: |-
    Soon after midnight on September 22, 1827, Joseph and Emma drove a borrowed wagon to the hill. Emma waited while Joseph climbed to the place where the plates lay. Moroni gave him the plates and the interpreters, with a charge to guard them carefully and a promise that they would be protected if he did.

    Word spread quickly. Neighbors who believed the plates were treasure searched the Smith property again and again, and Joseph moved the plates from one hiding place to another: a hollow log, under the hearth, in a cooper's shop.

    By December the couple could not stay. With fifty dollars from Martin Harris, a prosperous Palmyra farmer, they moved to Emma's parents' neighborhood in Harmony, Pennsylvania, with the plates hidden in a barrel of beans.
  significance: >-
    With the plates in his care, Joseph Smith could begin the translation that
    became the Book of Mormon. The work started that winter in Harmony, with
    Emma among his first scribes.

lost-manuscript:
  background: >-
    Martin Harris came to Harmony in the spring of 1828 and wrote for Joseph
    Smith from about April to June. Together they produced 116 pages of
    manuscript. Martin's wife, Lucy, doubted the work and resented the money
    he was giving to it. Martin begged to take the pages home to show her.
  account: |-
    Joseph asked the Lord twice and was told no. After a third request he was permitted to let the pages go, on the condition that Martin show them only to a few named members of his family. Martin took the only copy to Palmyra.

    The day after he left, Emma gave birth to a son who died the same day, and she came close to dying herself. After two weeks at her bedside, with no word from Martin, Joseph travelled to his parents' home. Martin arrived hours late for their meeting and admitted that the manuscript was gone. He had shown it to others and could not find it.

    The plates and the interpreters were taken from Joseph for a time. In July 1828 he received the revelation that is now Doctrine and Covenants 3, which rebuked him for fearing man more than God and promised that he could still be chosen. A later revelation told him not to translate the lost portion again.
  significance: >-
    The loss cost months of work and was one of the hardest lessons of Joseph
    Smith's early life. The opening of the Book of Mormon as published comes
    from a second record covering the same period, the small plates of Nephi.

translation-with-oliver-cowdery:
  background: >-
    After the loss of the manuscript, the translation moved slowly, with Emma
    and others writing when they could. Oliver Cowdery, a young schoolteacher,
    was boarding with Joseph's parents near Palmyra and heard about the plates
    from them. He prayed about what he had heard, felt that it was true, and
    set out for Pennsylvania with Joseph's brother Samuel.
  account: |-
    Oliver arrived in Harmony on April 5, 1829, and met Joseph Smith for the first time. Two days later, on April 7, he began to write.

    Joseph dictated and Oliver wrote, hour after hour, in the small house near the Susquehanna River. Oliver later said of those days that sitting under the sound of a voice dictated by inspiration awakened his deepest gratitude. The pace was remarkable: nearly the whole Book of Mormon, more than five hundred printed pages, was dictated in about three months.

    Questions raised by the text led the two men to pray, and several early revelations came in answer. Their question about baptism led directly to the restoration of the Aaronic Priesthood in May.
  significance: >-
    Almost all of the Book of Mormon as published was translated in this
    stretch of work. Oliver Cowdery became Joseph Smith's companion in the
    events that followed: the restoration of the priesthood, the witness of
    the plates and the organization of the Church.

aaronic-priesthood-restored:
  background: >-
    In May 1829 Joseph Smith and Oliver Cowdery were translating the account
    of the Savior's visit to the Nephites, which teaches baptism for the
    remission of sins. Neither of them had been baptized, and they did not
    know who had authority to do it.
  account: |-
    On May 15, 1829, they went into the woods near the Susquehanna River to pray. A messenger appeared in a cloud of light and said he was John, known in the New Testament as John the Baptist. He laid his hands on their heads and conferred the Priesthood of Aaron, which holds the keys of the ministering of angels, of the gospel of repentance and of baptism by immersion for the remission of sins.

    He told Joseph to baptize Oliver and Oliver to baptize Joseph, which they did in the river, and then to ordain one another. He said he acted under the direction of Peter, James and John, who held a higher priesthood that would be given to them in due time.

    Because of opposition in the neighborhood, they kept what had happened to themselves for a while.
  significance: >-
    Latter-day Saints understand this as the return of the authority to
    baptize. John the Baptist's words are Doctrine and Covenants 13. The site
    in Pennsylvania is now a Church historic site.

melchizedek-priesthood-restored:
  background: >-
    When John the Baptist conferred the Aaronic Priesthood, he said that it
    did not include the power to lay on hands for the gift of the Holy Ghost,
    and that this authority would come later through Peter, James and John.
  account: |-
    No record made at the time describes the event or gives its date. From later statements it took place after May 15, 1829, most likely within the following weeks.

    Joseph Smith and Oliver Cowdery said that Peter, James and John, three of the Savior's original apostles, appeared to them and conferred the Melchizedek Priesthood and the keys of the apostleship. In an 1842 letter Joseph placed it in the wilderness along the Susquehanna River, between Harmony, Pennsylvania, and Colesville, New York.
  significance: >-
    This authority allowed Joseph Smith and Oliver Cowdery to confer the gift
    of the Holy Ghost, to ordain others and to organize the Church the next
    spring. The date is shown here as approximate because the sources do not
    give one.

translation-completed:
  background: >-
    As the translation went on, hostility grew in Harmony. Oliver Cowdery
    wrote to his friend David Whitmer, whose family farmed at Fayette, New
    York, and asked for help. David came with a wagon and moved Joseph and
    Oliver about a hundred miles to his parents' home at the beginning of
    June 1829. Emma followed soon after.
  account: |-
    The Whitmers gave them board and a quiet upstairs room. Members of the family took turns as scribes alongside Oliver. While the work went on, Joseph applied for the copyright, which was filed on June 11, 1829.

    The translation was finished around the end of June. Neighbors and members of the Whitmer and Smith families were baptized in nearby Seneca Lake during the same weeks.

    Oliver Cowdery then made a second complete copy of the manuscript for the printer, so that the original never had to leave their hands. After the earlier loss, they took no chances.
  significance: >-
    The work that began with the plates in 1827 was complete. Within days the
    Three Witnesses and the Eight Witnesses were shown the plates, and Joseph
    Smith began looking for a printer.

three-witnesses:
  background: >-
    The translation itself said that three witnesses would be shown the plates
    by the power of God. Oliver Cowdery, David Whitmer and Martin Harris asked
    for the privilege, and a revelation promised it to them if they had
    faith.
  account: |-
    In late June 1829 the three men went with Joseph Smith into the woods near the Whitmer home and prayed in turn. Nothing happened. They tried again, with the same result. Martin Harris said he believed he was the cause and walked away.

    As the others prayed, an angel stood before them holding the plates and turned the leaves so that they could see the engravings. They heard a voice declare that the plates had been translated by the gift and power of God. Joseph then found Martin praying some distance off and joined him, and the same vision was opened to them both.

    Joseph's mother remembered him coming into the house afterward and saying how relieved he was that he no longer had to bear the testimony alone. A few days later, near the Smith home, Joseph showed the plates to eight more men, who handled them and turned the leaves.
  significance: >-
    The testimonies of the Three Witnesses and the Eight Witnesses have been
    printed in every edition of the Book of Mormon. All three of the Three
    Witnesses later left the Church for a time. Oliver Cowdery and Martin
    Harris returned, and David Whitmer did not, but none of them ever denied
    what he said he had seen.

book-of-mormon-published:
  background: >-
    Joseph Smith first approached Egbert B. Grandin, a young printer in
    Palmyra, who hesitated to take the job. After a Rochester printer agreed
    to do it, Grandin accepted. In August 1829 they agreed on five thousand
    copies for three thousand dollars, a very large run for a village press.
    Martin Harris mortgaged his farm as security.
  account: |-
    Printing took about seven months. Hyrum Smith and Oliver Cowdery carried a few pages of the printer's copy at a time to the shop. The manuscript had almost no punctuation; the typesetter, John H. Gilbert, added it as he went.

    During the winter a local newspaper editor began printing stolen extracts in his own paper until Joseph came from Pennsylvania to stop him. Some residents organized a boycott, and Grandin halted work until he was assured again that he would be paid.

    On March 26, 1830, the local paper announced that the book was for sale in Grandin's bookstore. It did not sell well at first. Martin Harris sold a large part of his farm the following year to pay the debt.
  significance: >-
    The published Book of Mormon became the first missionaries' chief tool;
    Samuel Smith set out with copies that summer. The Church was organized
    eleven days after the book went on sale.

church-organized:
  background: >-
    With the Book of Mormon in print and priesthood authority restored, Joseph
    Smith was directed by revelation to organize a church. New York law
    required a religious society to have between three and nine organizers,
    and six men were named.
  account: |-
    On Tuesday, April 6, 1830, several dozen believers gathered in the log home of Peter Whitmer Sr. at Fayette. The meeting opened with prayer. Those present voted to accept Joseph Smith and Oliver Cowdery as their teachers and to organize as a church. Joseph and Oliver then ordained each other elders.

    They blessed and passed the sacrament of bread and wine, and laid hands on those who had already been baptized to confirm them members and give the gift of the Holy Ghost. During the meeting Joseph received the revelation now known as Doctrine and Covenants 21, which named him a seer, a translator, a prophet and an apostle and told the Church to keep a record.

    More people were baptized that day, including Joseph's parents and Martin Harris. Joseph was overcome with joy at seeing his father baptized.
  significance: >-
    The Church was first called the Church of Christ. It became the Church of
    the Latter Day Saints in 1834, and in 1838 a revelation gave the name The
    Church of Jesus Christ of Latter-day Saints. General conferences are still
    held each April.

mission-to-the-west:
  background: >-
    The Book of Mormon promises that its message will go to the descendants of
    the peoples it describes, whom early members identified with American
    Indians. In the fall of 1830, revelations called Oliver Cowdery, Peter
    Whitmer Jr., Parley P. Pratt and Ziba Peterson to carry it to the tribes
    being moved to the country west of Missouri.
  account: |-
    The four left New York in October 1830 and travelled mostly on foot. They visited a Seneca community near Buffalo and then turned toward northeastern Ohio, where Parley Pratt had lived and had followed the preacher Sidney Rigdon.

    Rigdon let them preach to his congregation and read the Book of Mormon himself. Within about a month he and well over a hundred others in and around Kirtland had been baptized, more than doubling the membership of the Church. One of the converts, Frederick G. Williams, went on with the missionaries.

    They walked on through a severe winter, some fifteen hundred miles in all, and reached Independence, Missouri, early in 1831. They preached to the Shawnee and the Delaware across the border, where they were well received, until federal Indian agents ordered them to leave.
  significance: >-
    The mission did not establish the Church among the tribes, but it changed
    its course. The conversions in Ohio led to the command to gather there,
    and the missionaries were the first members in the part of Missouri that
    was soon named as Zion.

command-to-gather-to-ohio:
  background: >-
    By December 1830 there were more members in Ohio than in New York. Sidney
    Rigdon and Edward Partridge travelled east to meet Joseph Smith. In New
    York, opposition was growing, and Joseph had been arrested and tried more
    than once that year.
  account: |-
    The revelation now known as Doctrine and Covenants 37 told Joseph Smith and Sidney Rigdon to stop work on the translation of the Bible for the present and directed the Church to "assemble together at the Ohio."

    At a conference at Fayette on January 2, 1831, a second revelation gave reasons and promises: in Ohio the Saints would receive the Lord's law and be endowed with power. Some members were reluctant to sell good farms in the middle of winter, and some properties sold at a loss or could not be sold at all.

    Joseph and Emma left by sleigh at the end of January. The rest followed in groups in the spring, travelling by the Erie Canal to Buffalo and then by Lake Erie. Joseph's mother, Lucy Mack Smith, led one company of about eighty.
  significance: >-
    This was the first time the Saints were asked to gather to one place, a
    pattern that shaped the next sixty years of their history. It ended the
    New York period after less than a year as an organized church.

# -------------------------------------------------------------------- Ohio

joseph-arrives-in-kirtland:
  background: >-
    Kirtland was a small farming and mill town in northeastern Ohio, about
    twenty miles east of Cleveland. Since the missionaries' visit in November
    1830, the new converts there had been without experienced leaders, and
    unusual practices had crept into their meetings.
  account: |-
    Joseph and Emma Smith reached Kirtland around the beginning of February 1831, with Sidney Rigdon and Edward Partridge. Emma was expecting twins. According to an account preserved in the Whitney family, Joseph walked into the Gilbert and Whitney store, held out his hand to Newel K. Whitney and greeted him by name, saying that Whitney had prayed him there.

    The Smiths lived with Newel and Elizabeth Ann Whitney for several weeks. Within days, on February 4, a revelation called Edward Partridge as the first bishop of the Church. Another, on February 9, gave the law that had been promised in New York.

    The New York members arrived through the spring and settled in Kirtland and the surrounding towns.
  significance: >-
    Kirtland was the headquarters of the Church for the next seven years. More
    sections of the Doctrine and Covenants were received in Ohio than in any
    other place, and the first temple was built there.

law-of-the-church:
  background: >-
    The revelation that sent the Saints to Ohio promised that they would
    receive the Lord's law there. Some Ohio converts were already trying to
    live with all things in common, in a group on Isaac Morley's farm called
    "the Family," and the arrangement was causing trouble.
  account: |-
    On February 9, 1831, twelve elders met with Joseph Smith, united in prayer and asked for the promised law. The revelation that followed is now Doctrine and Covenants 42. More was added on February 23.

    It directs the elders to go out two by two and to teach from the scriptures by the Spirit. It restates commandments against killing, stealing, lying and adultery, and gives directions for caring for the sick and settling disputes.

    It also sets out the law of consecration. Members were to consecrate their property to the Church through the bishop and receive back a stewardship suited to their family's needs. What was left over went to the bishop's storehouse for the poor and for the purposes of the Church.
  significance: >-
    The early Saints called this revelation simply "the law." It established
    the bishop's responsibility for the poor and the principle of
    consecration, which the Saints tried to practice in Ohio and Missouri and
    which remains part of Latter-day Saint belief.

zion-identified:
  background: >-
    Earlier revelations spoke of a city of Zion, a New Jerusalem, to be built
    somewhere near the western border of the United States. After a conference
    in Kirtland in June 1831, Joseph Smith and about two dozen other elders
    were told to travel to Missouri, preaching on the way, and that the place
    would be made known there.
  account: |-
    Joseph left Kirtland on June 19 and reached Independence, in Jackson County, in the middle of July, after a journey of about nine hundred miles. Independence was then a rough frontier town of a few hundred people, the last settlement before Indian Territory and the starting point of the Santa Fe Trail.

    On July 20, 1831, he received the revelation now known as Doctrine and Covenants 57. It declared Missouri the land appointed for the gathering of the Saints and Independence the "center place," and said that a temple should stand a little west of the courthouse.

    The revelation told the Saints to buy land, and gave assignments: Edward Partridge to divide it among the families, Sidney Gilbert to open a store, and William W. Phelps to set up a printing press. A group of members from Colesville, New York, arrived within days and became the first settlers.
  significance: >-
    For the next several years the Church had two centers nine hundred miles
    apart, Kirtland and Missouri. The hope of building Zion in Jackson County,
    and its loss two years later, shaped much of what followed.

independence-temple-site-dedicated:
  background: >-
    The revelation of July 20, 1831, had pointed out the place for a temple in
    Independence. Joseph Smith and the elders with him stayed a few weeks to
    lay the foundations of the settlement before returning to Ohio.
  account: |-
    On August 2, 1831, a few miles west of Independence, twelve men representing the tribes of Israel carried and laid the first log for a house, and Sidney Rigdon dedicated the land of Zion for the gathering of the Saints.

    The next day, August 3, Joseph Smith and a small group went to a rise of ground west of the courthouse. A psalm was read, a stone was set to mark a corner, and Joseph dedicated the spot for a temple.

    A conference was held on August 4, and within a week most of the elders, Joseph among them, started back for Kirtland. Bishop Edward Partridge and a few others stayed to buy land and receive the settlers.
  significance: >-
    No temple was built on the site in the lifetime of those who dedicated it.
    The Saints were driven from Jackson County in 1833. The place has
    remained important to Latter-day Saints and to the other churches that
    trace their beginnings to Joseph Smith.

the-vision:
  background: >-
    In September 1831 Joseph and Emma Smith moved to the farm of John and
    Alice Johnson in Hiram, Ohio, about thirty miles south of Kirtland. There
    Joseph worked with Sidney Rigdon as scribe on his inspired translation of
    the Bible. On February 16, 1832, they reached John 5:29, on the
    resurrection of the just and the unjust, and wondered at what it meant.
  account: |-
    As they pondered the verse in an upstairs room, a vision opened to both men at once. About a dozen others were in the room. One of them later recalled that Joseph and Sidney described aloud what they saw, each confirming the other, while Joseph sat calm and Sidney grew limp and pale.

    They saw the Savior on the right hand of the Father and bore witness "that he lives." They saw the fall of Lucifer and the suffering of those who follow him. They then saw that almost all of God's children are heirs to a kingdom of glory, compared to the sun, the moon and the stars: the celestial, the terrestrial and the telestial.

    They were told to write the vision while they were still in the Spirit. It is now Doctrine and Covenants 76.
  significance: >-
    "The Vision," as the early Saints called it, changed how they understood
    heaven and salvation. It was a hard doctrine for some who had been raised
    with a simple heaven and hell; Brigham Young said he had to set it aside
    and pray before he could accept it.

mob-attack-at-hiram:
  background: >-
    Not everyone around Hiram welcomed the Smiths. Two former members, Ezra
    Booth and Symonds Ryder, had turned against the Church, and Booth's
    letters attacking it were printed in an Ohio newspaper. Some neighbors
    feared that the Johnson family's property would pass to the Church.
  account: |-
    On the night of March 24, 1832, Joseph Smith had fallen asleep while caring for one of the twins he and Emma had adopted, who was sick with measles. A group of men burst in and dragged him outside. They choked him, tore off his clothes and tried to force a vial of liquid into his mouth, chipping a tooth. They then smeared him with hot tar and covered him in feathers.

    Sidney Rigdon was dragged from his house by his heels over the frozen ground. His head was badly injured and he was delirious for days.

    Joseph made his way back to the house, where friends spent the night scraping off the tar. The next morning was Sunday. He preached as usual, with some of the mob in the congregation, and baptized three people that afternoon. The sick child, Joseph Murdock Smith, died five days later.
  significance: >-
    The attack was the first serious physical violence against Joseph Smith.
    He left for Missouri a week later, and that autumn the family moved back
    to Kirtland. The Johnson home still stands and is a Church historic site.

school-of-the-prophets:
  background: >-
    The revelation known as the "olive leaf," received at the end of December
    1832, told the elders to teach one another and to "seek learning, even by
    study and also by faith." It directed them to organize a school and laid
    out how its meetings should be conducted.
  account: |-
    The school opened on January 23, 1833, in a small upstairs room of Newel K. Whitney's store in Kirtland. A small group of elders attended, and Joseph Smith presided. On the first day he washed the feet of each member, following the pattern in the Gospel of John.

    The members arrived early, often fasting, and greeted one another with a set salutation of fellowship. They studied the revelations and doctrine, and also practical subjects such as grammar. The first session closed in April 1833 so that the elders could go out to preach.

    Similar schools met in Kirtland in later winters, including a Hebrew class taught by a Jewish scholar in 1836.
  significance: >-
    The school is an early example of the Latter-day Saint commitment to
    education alongside faith. Members reported powerful spiritual experiences
    in its meetings, and the Word of Wisdom was received there in February
    1833.

word-of-wisdom:
  background: >-
    The men who met in the School of the Prophets smoked pipes and chewed
    tobacco, as was common at the time. Brigham Young later said that the
    cloud of smoke and the state of the floor, which Emma Smith had to clean,
    led Joseph Smith to ask the Lord about it. Temperance was also a public
    cause in the 1830s.
  account: |-
    On February 27, 1833, Joseph Smith received the revelation now known as Doctrine and Covenants 89 and read it to the elders gathered in the school. Those who were present remembered that they put away their pipes and tobacco.

    The revelation counsels against wine and strong drink, tobacco and "hot drinks," which Church leaders soon explained as tea and coffee. It commends herbs, fruits and grains, and says that meat should be used sparingly. It promises health, "wisdom and great treasures of knowledge" to those who keep it.

    It was given at first "not by commandment or constraint," but as counsel adapted "to the capacity of the weak."
  significance: >-
    Over the following decades the Word of Wisdom came to be treated as a
    commandment, and in the early twentieth century keeping it became a
    requirement for entering the temple. It is one of the best-known
    Latter-day Saint practices.

kirtland-temple-construction-begins:
  background: >-
    The "olive leaf" revelation of December 1832 commanded the Saints to build
    a house of God. Months passed without a start. On June 1, 1833, another
    revelation rebuked them for the delay and promised that in the house they
    would be endowed with power.
  account: |-
    Within days Hyrum Smith and others began digging the foundation trench by hand. The cornerstones were laid on July 23, 1833.

    The Saints in Kirtland were few and poor, and the building took nearly three years. Men gave a day's work in every week, quarrying sandstone south of the town and hauling it to the site. Joseph Smith worked in the quarry as foreman. Women spun, wove and sewed clothing for the workmen and later made the curtains and carpets. Because of threats, the walls were guarded at night.

    The building followed a plan that Joseph Smith and his counselors said was shown to them in vision: two large halls, one above the other, each with tiers of pulpits at both ends.
  significance: >-
    The Kirtland Temple was the first temple of the Restoration, finished and
    dedicated in March 1836. It still stands. The Church of Jesus Christ of
    Latter-day Saints acquired it in 2024.

expulsion-from-jackson-county:
  background: >-
    By the summer of 1833 about twelve hundred Saints had settled in Jackson
    County, and more were coming. The older settlers, most of them from the
    South, distrusted their religion, their growing numbers and votes, their
    friendliness to the Indians and their views on slavery. On July 20, 1833,
    a mass meeting demanded that they leave. When the leaders asked for time,
    the crowd tore down the printing office and tarred and feathered Bishop
    Edward Partridge.
  account: |-
    Under threat, the leaders signed an agreement to leave the county in two stages. They then appealed to the governor, who advised them to seek redress in the courts, and hired lawyers. When that became known, the attacks began again.

    On the night of October 31, 1833, a mob struck a settlement on the Big Blue River, unroofing houses and whipping men. Raids went on for a week. After a skirmish on November 4 in which men on both sides were killed, the county militia was called out and the Saints gave up their weapons. Mobs then rode from settlement to settlement, driving families out.

    Most fled north across the Missouri River into Clay County in bitter weather and camped on the river bank. Many had left their homes, crops and animals behind and were never paid for them.
  significance: >-
    The loss of Jackson County ended the first attempt to build Zion. It led
    to Zion's Camp the next year and to five more years of conflict in
    Missouri. The destroyed press had been printing the Book of Commandments,
    the first collection of Joseph Smith's revelations.

zions-camp:
  background: >-
    In February 1834 Parley P. Pratt and Lyman Wight arrived in Kirtland from
    Missouri to report on the exiles in Clay County. Missouri's governor had
    suggested that the state would escort the Saints back to their lands if
    they could then defend themselves. A revelation told Joseph Smith to raise
    a company to go.
  account: |-
    The first men left Kirtland at the beginning of May 1834. A second group from Michigan, led by Hyrum Smith, joined them on the way. At its largest the camp numbered a little over two hundred men, with a few women and children. They walked about nine hundred miles in some seven weeks, often short of food and good water, and quarrels in the ranks tried Joseph's patience.

    When they reached Missouri, the governor withdrew his offer of help. On June 19 an armed force gathering to attack the camp near the Fishing River was scattered by a violent storm. On June 22 a revelation said that Zion would not be redeemed at that time, and that the Saints must first be taught and endowed with power.

    Cholera then swept the camp and more than a dozen people died. Joseph discharged the company at the beginning of July, and most walked home.
  significance: >-
    Zion's Camp did not restore the Saints to their lands. It did test and
    train the men who marched. Most of the first Quorum of the Twelve and all
    of the first Quorum of the Seventy, called the following year, were chosen
    from its ranks.

quorum-of-the-twelve-organized:
  background: >-
    A revelation in June 1829, before the Church was organized, said that
    twelve apostles would be called and gave Oliver Cowdery and David Whitmer
    the task of searching them out. Nearly six years later, after Zion's Camp,
    Joseph Smith said the time had come.
  account: |-
    On February 14, 1835, Joseph Smith called a meeting in Kirtland of those who had marched with Zion's Camp. He asked the Three Witnesses of the Book of Mormon, Oliver Cowdery, David Whitmer and Martin Harris, to pray and then to name the Twelve.

    Those chosen were Thomas B. Marsh, David W. Patten, Brigham Young, Heber C. Kimball, Orson Hyde, William E. McLellin, Parley P. Pratt, Luke Johnson, William Smith, Orson Pratt, John F. Boynton and Lyman E. Johnson. They were ordained over the following days and weeks, and were ranked in the quorum by age.

    The first Quorum of the Seventy was organized two weeks later. In the spring a revelation on priesthood, now Doctrine and Covenants 107, described the Twelve as special witnesses of the name of Christ in all the world. That summer they travelled together through the eastern states on their first mission as a quorum.
  significance: >-
    The Quorum of the Twelve became the second governing body of the Church
    after the First Presidency, and led the Church after Joseph Smith's death.
    Several of the first Twelve later left the Church during the troubles in
    Kirtland and Missouri.

kirtland-temple-dedication:
  background: >-
    The temple was finished after nearly three years of work. In the weeks
    before the dedication, Church leaders met in the building for solemn
    assemblies and ordinances of washing and anointing, and many recorded
    visions and other spiritual experiences.
  account: |-
    On Sunday, March 27, 1836, people began gathering at the doors by seven in the morning. Close to a thousand were seated, and many more had to be turned away. The service began at nine and lasted about seven hours.

    Sidney Rigdon preached for more than two hours. The congregation voted, quorum by quorum, to sustain the leaders of the Church. Joseph Smith then read the dedicatory prayer, which he had received by revelation and which is now Doctrine and Covenants 109. It asks that the house be accepted and that those who worship there go out from it armed with power.

    The choir sang "The Spirit of God," written for the occasion by William W. Phelps. The sacrament was passed, several people spoke of seeing angels, and the meeting closed with the whole congregation giving the Hosanna Shout. The service was repeated a few days later for those who had not been able to get in.
  significance: >-
    This was the first temple dedication of the Restoration. The hymn sung
    that day and the Hosanna Shout are still part of Latter-day Saint temple
    dedications.

kirtland-temple-visions:
  background: >-
    One week after the dedication, on Sunday, April 3, 1836, about a thousand
    people met again in the temple. It was Easter Sunday. In the afternoon
    Joseph Smith helped to bless and pass the sacrament.
  account: |-
    After the sacrament, Joseph Smith and Oliver Cowdery went to the pulpits at the west end of the hall. Canvas curtains were lowered around them, and they knelt in silent prayer.

    The account says that when they rose, they saw the Lord standing on the breastwork of the pulpit. He declared that he had accepted the house and that his name would be there.

    Three messengers followed. Moses committed the keys of the gathering of Israel. Elias committed the dispensation of the gospel of Abraham. Elijah, whose return the prophet Malachi had foretold, committed the keys of turning the hearts of fathers and children to one another.

    The account was written into Joseph Smith's journal by a scribe. It was not published until 1852, and became part of the Doctrine and Covenants in 1876.
  significance: >-
    Latter-day Saints trace to this day the authority for missionary work
    throughout the world and for the sealing of families in temples. It is
    recorded as Doctrine and Covenants 110.

first-mission-to-england:
  background: >-
    In the spring of 1837 Kirtland was in crisis. A nationwide financial panic
    had brought down the Saints' bank, and many members, including some
    leaders, had turned against Joseph Smith. In the temple one Sunday, Joseph
    told Heber C. Kimball that the Lord wanted him to open a mission in
    England. Heber, a potter with little schooling, felt quite unequal to it.
  account: |-
    Heber C. Kimball, Orson Hyde, Willard Richards and Joseph Fielding left Kirtland on June 13, 1837, and were joined by three members from Canada. They sailed from New York and landed at Liverpool in July with almost no money.

    They went first to Preston, in Lancashire, where Joseph Fielding's brother was a minister. He let them preach in his chapel on their first Sunday, then closed it to them when his congregation began to ask for baptism.

    The first nine converts were baptized in the River Ribble on July 30, 1837, before a large crowd of onlookers. The work spread through the mill towns and villages of the Ribble Valley. When Heber sailed for home in April 1838, there were about fifteen hundred members in England.
  significance: >-
    This was the first Latter-day Saint mission outside North America. British
    converts, and the thousands more who followed after 1840, emigrated in
    great numbers and became a large part of the Church in Nauvoo and Utah.

joseph-leaves-kirtland:
  background: >-
    To ease a shortage of money and credit, Church leaders opened a banking
    company, the Kirtland Safety Society, in January 1837. The state refused
    it a charter, a national panic struck that spring, and it failed within
    the year. Many lost savings and blamed Joseph Smith. Lawsuits multiplied,
    a group of dissenters claimed the temple, and several apostles were among
    those who turned away.
  account: |-
    By the end of 1837 Joseph Smith had been threatened with violence and with arrest for debt. On the night of January 12, 1838, warned of another warrant, he and Sidney Rigdon left Kirtland on horseback. Their families joined them along the road.

    The journey of more than eight hundred miles, in winter and with pursuers behind them for part of the way, took two months. They reached Far West, Missouri, on March 14, 1838, and were welcomed by the Saints there.

    Most members who remained loyal followed during the year. The largest group, the Kirtland Camp of more than five hundred people, left together in July.
  significance: >-
    The departure ended the Ohio period. The headquarters of the Church moved
    to Missouri, where conflict broke out within months. The temple was left
    behind, and only a few members stayed in Kirtland.

# ---------------------------------------------------------------- Missouri

name-of-the-church-revealed:
  background: >-
    Far West was founded in 1836 in Caldwell County, which the Missouri
    legislature created as a place for the Saints to settle. By the spring of
    1838 it was a town of several thousand and, with Joseph Smith's arrival in
    March, the new headquarters. The Church had been called the Church of
    Christ from 1830 and the Church of the Latter Day Saints from 1834.
  account: |-
    On April 26, 1838, six weeks after reaching Far West, Joseph Smith received the revelation now known as Doctrine and Covenants 115. It is addressed to the leaders and members of "The Church of Jesus Christ of Latter Day Saints," and says, "For thus shall my church be called in the last days."

    The revelation calls on the Saints to "arise and shine forth" as a light to the nations. It declares Far West holy ground and commands them to build a temple there, beginning on the Fourth of July, without the First Presidency going into debt for it.

    The cornerstones were laid on July 4, 1838, with a parade and speeches. The walls never rose. Within four months the Saints had been ordered out of the state.
  significance: >-
    The name given in this revelation is the one the Church has used ever
    since. The cornerstones of the Far West temple can still be seen at the
    site.

extermination-order:
  background: >-
    As the Saints spread into the counties around Caldwell in 1838, tension
    with other settlers rose. A brawl at an election in Gallatin on August 6
    was followed by weeks of raids by both sides. Vigilantes besieged and
    drove out the Saints at De Witt. Latter-day Saint militia burned and
    plundered in Daviess County. On October 25 they fought state militia at
    Crooked River, where the apostle David W. Patten was killed. Alarming and
    exaggerated reports reached the governor.
  account: |-
    On October 27, 1838, Governor Lilburn W. Boggs sent an order to General John B. Clark of the state militia. It said that the Mormons "must be treated as enemies, and must be exterminated or driven from the State."

    Some twenty-five hundred militia were soon gathered outside Far West. Three days after the order was signed, a militia company attacked the settlement at Hawn's Mill. On October 31 Joseph Smith and other leaders were arrested, and on November 1 Far West surrendered.

    The terms of surrender required the Saints to give up their arms, sign over their property to pay the costs of the conflict, and leave Missouri.
  significance: >-
    The order gave the force of law to the expulsion of some eight to ten
    thousand people from Missouri in the winter of 1838–39. It stayed on the
    books until June 25, 1976, when Governor Christopher S. Bond rescinded it
    and expressed regret on behalf of the state.

hawns-mill:
  background: >-
    Jacob Hawn's mill stood on Shoal Creek in eastern Caldwell County. About
    thirty Latter-day Saint families lived around it, and others arriving from
    Ohio were camped there in wagons. A few days earlier the settlers had
    agreed a truce with a local militia company.
  account: |-
    Late in the afternoon of October 30, 1838, more than two hundred mounted militiamen rode out of the woods. A leader of the settlement waved his hat and called for peace. The riders opened fire.

    The women and children ran across the creek for the woods. Many of the men took cover in the blacksmith shop, but the gaps between its logs were wide and the attackers fired through them. Seventeen men and boys were killed and more than a dozen people were wounded. Among the dead were a ten-year-old boy, Sardius Smith, and an elderly veteran, Thomas McBride.

    The survivors, expecting the attackers to return, buried the dead the next day in an unfinished well. The boy's mother, Amanda Barnes Smith, stayed to nurse another son whose hip had been shot away; her account of his recovery is one of the best-known records of the attack.
  significance: >-
    Hawn's Mill was the deadliest single attack of the conflict in Missouri.
    The militia had probably not yet heard of the governor's order. No one was
    ever brought to trial for the killings.

far-west-surrenders:
  background: >-
    By the end of October 1838 several thousand state militia surrounded Far
    West, and the governor's order was in their commander's hands. The Saints
    had thrown up a barricade of wagons and timber, but they were heavily
    outnumbered.
  account: |-
    On October 31 the colonel commanding the Latter-day Saint forces met the militia general under a flag of truce. He returned and told Joseph Smith, Sidney Rigdon, Parley P. Pratt, Lyman Wight and George W. Robinson that the general wished to confer with them. When they walked out, they were seized as prisoners. Hyrum Smith and Amasa Lyman were arrested the next day.

    That night the prisoners lay on the ground in the rain under guard. A court-martial sentenced them to be shot in the public square the next morning. General Alexander Doniphan, who was ordered to carry it out, refused. He called it cold-blooded murder and said he would hold his superior to account if it was done. The order was dropped.

    Far West surrendered on November 1. The militia plundered the town. The prisoners were allowed a few minutes with their families and were then taken to Independence and on to Richmond, where a judge ordered them held for trial.
  significance: >-
    The surrender ended the Saints' time in Missouri. Joseph Smith spent the
    next five and a half months as a prisoner, most of them in Liberty Jail,
    while the Twelve organized the exodus to Illinois.

liberty-jail:
  background: >-
    After a hearing at Richmond in November 1838, Joseph Smith, Hyrum Smith,
    Sidney Rigdon, Lyman Wight, Caleb Baldwin and Alexander McRae were charged
    with treason and other crimes. Richmond had no secure jail, so they were
    sent to the one at Liberty, in Clay County, to wait for trial.
  account: |-
    The six men arrived on December 1, 1838. The jail was a small stone building with walls about four feet thick. They were kept mostly in the lower room, a space about fourteen feet square reached through a trapdoor, with two narrow barred openings for light and a ceiling too low for some of them to stand upright. They slept on straw through an unusually cold winter. The food was so bad that they could hardly eat it.

    Visitors brought news of the Saints being driven from the state. Emma Smith came three times. Sidney Rigdon, who was ill, was released in February. Two attempts to escape failed.

    In March 1839 Joseph dictated two long letters to the Church. They begin in anguish, "O God, where art thou?" and move to the answer he received: that his sufferings would be "but a small moment" and would give him experience. In April the prisoners were taken to another county for a hearing. On the way to a new venue their guards let them go, and they reached Illinois on April 22.
  significance: >-
    Parts of the letters are now Doctrine and Covenants 121, 122 and 123, some
    of the most quoted passages in Latter-day Saint scripture. A later Church
    historian called the jail a "prison-temple" for what was revealed there.

exodus-from-missouri:
  background: >-
    The surrender at Far West required the Saints to leave Missouri, and the
    militia general told them not to think of staying another season. Joseph
    and Hyrum Smith and Sidney Rigdon were in jail. Many families had lost
    their animals, wagons and stores.
  account: |-
    Leadership fell to Brigham Young, the senior apostle still at liberty, with Heber C. Kimball. On January 29, 1839, members meeting at Far West made a covenant, at Brigham's proposal, to put their property together so that no one who wanted to leave would be left behind. A committee organized wagons and food and sent the poorest families first.

    Between eight and ten thousand people crossed the state that winter, about two hundred miles to the Mississippi River. Emma Smith crossed the frozen river on foot in February with her four children, carrying the manuscripts of Joseph's Bible translation in bags tied at her waist.

    The people of Quincy, Illinois, a town of fewer than two thousand, took in several thousand refugees, gave them food and work, and raised money for them.

    On April 26, 1839, members of the Twelve went back in secret to the temple site at Far West to begin their mission to Britain from that spot, as a revelation had directed.
  significance: >-
    The exodus was the first time Brigham Young organized the removal of the
    whole people, seven years before he did it again from Nauvoo. Latter-day
    Saints have long remembered Quincy's kindness.

# ------------------------------------------------------------------ Nauvoo

nauvoo-settled:
  background: >-
    While the Saints sheltered in Quincy, a land dealer offered the Church
    large tracts on both sides of the Mississippi River about fifty miles to
    the north. Joseph Smith escaped from custody in Missouri in April 1839 and
    within days was looking at the land.
  account: |-
    The Church bought land on credit at a nearly empty village called Commerce, on a bend in the river. Joseph Smith moved his family into a log house there on May 10, 1839.

    The low ground by the river was marshy, and that summer malaria spread through the camps. Joseph and Emma filled their house and yard with the sick. On July 22, though ill himself, Joseph went from tent to tent on both sides of the river blessing people, a day the Saints remembered for its healings.

    The swamps were drained and a city was laid out in squares. Joseph named it Nauvoo, from a Hebrew word he said meant a beautiful place. In December 1840 the Illinois legislature granted a charter that gave the city its own courts, a university and a militia, the Nauvoo Legion. Converts poured in, many from Britain. By 1844 about twelve thousand people lived there.
  significance: >-
    Nauvoo was the headquarters of the Church for seven years and, for a time,
    one of the largest cities in Illinois. The temple, the Relief Society and
    many teachings of Joseph Smith's last years belong to this period.

mission-of-the-twelve-to-britain:
  background: >-
    A revelation in July 1838 called the Twelve to cross the ocean the
    following spring. By the time they left Nauvoo in the late summer of 1839,
    they had been driven from Missouri, and most were sick with malaria and
    leaving families who were sick too.
  account: |-
    John Taylor and Wilford Woodruff reached Liverpool in January 1840. Brigham Young, Heber C. Kimball, Parley P. Pratt, Orson Pratt and George A. Smith followed in April. Willard Richards, already in England, was ordained an apostle there, so that eight of the Twelve served together.

    Wilford Woodruff went to Herefordshire, where a group of some six hundred who had broken away from the Methodists, the United Brethren, joined the Church almost to a person. Others preached in Liverpool, Manchester, London, Scotland and Ireland.

    The apostles also built what would last. They printed the Book of Mormon and a hymnbook in England, started a newspaper, the Millennial Star, with Parley P. Pratt as editor, and set up a system to help converts emigrate. The first company sailed in June 1840.

    When most of the Twelve sailed home in April 1841, several thousand people had been baptized.
  significance: >-
    The mission changed the Church and the quorum. British converts gave
    Nauvoo and later Utah a large share of their people. The Twelve came home
    united under Brigham Young, and Joseph Smith gave them wider
    responsibility for the affairs of the Church.

nauvoo-temple-commanded:
  background: >-
    In August 1840 Joseph Smith first taught that the Saints could be baptized
    on behalf of relatives who had died without the chance. They began at once
    in the Mississippi River. A temple had been talked of in Nauvoo from that
    autumn, and a site was chosen on the bluff above the town.
  account: |-
    On January 19, 1841, Joseph Smith received the long revelation now known as Doctrine and Covenants 124. It commands the Saints to build a house to the Lord where the fulness of the priesthood could be restored, and says that baptisms for the dead belong in a temple and would be accepted in the river only for a time. It also gave directions for a boarding house, the Nauvoo House, and named the officers of the Church, with Hyrum Smith as patriarch.

    The cornerstones were laid on April 6, 1841. Men gave one day's work in ten, cutting limestone from quarries near the city and hauling pine from Wisconsin. Women sewed for the workmen and gave pennies to buy glass and nails. A wooden font resting on twelve carved oxen was dedicated in the basement in November 1841, and baptisms for the dead moved there.

    The walls were still rising when Joseph Smith was killed. The Saints pressed on, held ordinances in the building in the winter of 1845–46, and dedicated it in the spring of 1846 as they were leaving.
  significance: >-
    The Nauvoo Temple was the first in which the full temple ordinances were
    given. It was burned by an arsonist in 1848 and its walls were later
    brought down by a storm. The Church rebuilt it on the original site and
    dedicated it in 2002.

relief-society-organized:
  background: >-
    In the spring of 1842 Sarah Granger Kimball and her seamstress, Margaret
    Cook, decided to make shirts for the men building the temple and invited
    their neighbors to form a sewing society. Eliza R. Snow drew up a
    constitution. When they showed it to Joseph Smith, he praised it and said
    he had something better: he would organize the women under the priesthood,
    after the pattern of the priesthood.
  account: |-
    On March 17, 1842, twenty women met with Joseph Smith, John Taylor and Willard Richards in the room over Joseph's red brick store. The women elected Emma Smith president. She chose Sarah M. Cleveland and Elizabeth Ann Whitney as counselors, and Eliza R. Snow was appointed secretary.

    The women debated the name and chose "Relief" over "Benevolent." Emma said that they were going to do something extraordinary and expected pressing calls. Joseph gave five dollars to begin the society's funds.

    The society looked after the poor and the sick, found work for widows and gathered donations for the temple. Joseph spoke to the women six times that year, and Eliza R. Snow's minutes are the main record of what he taught them. Membership passed thirteen hundred within two years.
  significance: >-
    The society stopped meeting in 1844. Eliza R. Snow carried the minute book
    to Utah, where the Relief Society was organized again throughout the
    Church from 1867 with her help. It is now one of the largest women's
    organizations in the world.

epistle-on-baptism-for-the-dead:
  background: >-
    In May 1842 the former governor of Missouri, Lilburn W. Boggs, was shot
    and wounded, and Joseph Smith was accused of being behind it. Missouri
    asked Illinois to hand him over. From August he stayed out of sight in the
    homes of friends in and around Nauvoo. At the beginning of September he
    wrote to the Church about keeping records of baptisms for the dead, and a
    few days later he wrote again at greater length.
  account: |-
    The second letter, now Doctrine and Covenants 128, sets out how the ordinance should be recorded. A recorder in each ward should be an eyewitness and write down what he sees and hears, and a general recorder should enter these certificates in the book of the Church. Joseph ties this to the promise that what is recorded on earth is recorded in heaven.

    He then turns from procedure to meaning. He writes that baptism is a likeness of burial and resurrection, and that the prophet Malachi's words about Elijah point to a "welding link" between parents and children. The living and the dead depend on each other: "neither can we without our dead be made perfect."

    The letter ends as a hymn of rejoicing, recalling the messengers of the Restoration one by one and asking, "Shall we not go on in so great a cause?"
  significance: >-
    The letter is the fullest explanation Joseph Smith wrote of why Latter-day
    Saints perform ordinances for the dead, and it lies behind the Church's
    long commitment to family history. The extradition case against him was
    dismissed in January 1843.

martyrdom:
  background: >-
    By 1844 Joseph Smith faced opposition from neighbors who feared Nauvoo's
    size and power, and from former associates who rejected his recent
    teachings, including plural marriage. On June 7 the dissenters published a
    newspaper, the Nauvoo Expositor, attacking him. The city council declared
    it a public nuisance and had the press destroyed. The outcry was
    immediate. Joseph was charged with riot, and Governor Thomas Ford pledged
    the state's protection if he would come to Carthage, the county seat.
  account: |-
    Joseph and Hyrum Smith rode to Carthage on June 24, 1844. On the way Joseph said he was going "like a lamb to the slaughter." They posted bail on the riot charge, but were then charged with treason, for which there was no bail, and were held in the jail.

    On June 27 the governor left for Nauvoo, leaving the jail in the care of a local militia company hostile to the prisoners. With Joseph and Hyrum in the upstairs bedroom were the apostles John Taylor and Willard Richards. That afternoon John Taylor sang a hymn, "A Poor Wayfaring Man of Grief," and Hyrum asked him to sing it again.

    A little after five o'clock, a crowd of armed men with blackened faces rushed the jail. Hyrum was shot through the door and fell, saying, "I am a dead man." John Taylor was hit four times and survived. Joseph was struck as he reached the window and fell to the ground outside. Willard Richards was barely grazed.

    Joseph was thirty-eight and Hyrum forty-four. Their bodies were taken to Nauvoo the next day, and thousands filed past to see them. Five men were tried for the murders in 1845 and acquitted.
  significance: >-
    The deaths of the Prophet and the Patriarch were the deepest loss the
    early Church suffered, and raised at once the question of who would lead
    it. John Taylor's tribute, now Doctrine and Covenants 135, says they
    sealed their testimony with their blood.

twelve-sustained-to-lead:
  background: >-
    When Joseph Smith was killed, most of the Twelve were in the eastern
    states. Sidney Rigdon, his counselor, who had been living in Pittsburgh,
    reached Nauvoo first, on August 3, 1844, and asked for a meeting to choose
    a guardian for the Church. Brigham Young and several other apostles
    arrived on the evening of August 6.
  account: |-
    On the morning of August 8, 1844, thousands gathered in the grove near the temple. Sidney Rigdon spoke for about an hour and a half, offering himself as guardian. Brigham Young then spoke briefly and called a second meeting for the afternoon.

    In the afternoon Brigham Young said that Joseph Smith had given the Twelve all the keys and powers he held, and that no one could stand between Joseph and the Twelve. He asked the congregation whether they wanted the Twelve to stand as the presidency of the Church. The vote in favor was nearly unanimous.

    Many who were there later wrote that, as Brigham Young spoke, he looked and sounded to them like Joseph Smith, and that they took it as a sign.
  significance: >-
    Most of the Saints followed the Twelve, and Brigham Young led the Church
    for the next thirty-three years. Others followed different leaders; some
    of them later formed a separate church under Joseph Smith's son. The
    meeting set the pattern of succession the Church still follows.

nauvoo-temple-ordinances:
  background: >-
    Joseph Smith first gave the temple endowment to a small group in the room
    above his store in May 1842, and charged the Twelve to give it to all the
    faithful once the temple was ready. After his death the Saints pushed the
    building forward even as mobs burned farms around Nauvoo. In the fall of
    1845 they agreed to leave Illinois in the spring.
  account: |-
    The upper floor of the temple was finished first and dedicated on November 30, 1845. Endowments began on December 10.

    For the next eight weeks the temple was in use almost without a break. Brigham Young, Heber C. Kimball and others worked there day and night, sometimes sleeping in the building. Husbands and wives were also sealed to each other.

    Brigham Young meant to stop at the beginning of February so that the first wagons could leave. He wrote that when he walked away from the temple and looked back, the crowd was still waiting, so he returned and carried on for several more days. By the time the work ended, more than five thousand people had received their endowment.
  significance: >-
    The Saints left Nauvoo having received the ordinances they had built the
    temple for. Many wrote later that the covenants they made there sustained
    them through the journey west.

# ------------------------------------------------------- Westward migration

exodus-from-nauvoo:
  background: >-
    After mobs burned outlying settlements in September 1845, Church leaders
    promised to leave Illinois "as soon as grass grows and water runs." The
    city spent the winter building wagons. Rumors that the government would
    try to stop them from going persuaded the leaders to start early.
  account: |-
    The first wagons were ferried across the Mississippi on February 4, 1846, and made camp at Sugar Creek, a few miles into Iowa. Brigham Young crossed in the middle of the month. For a few days at the end of February the river froze hard enough for wagons to drive across on the ice.

    The camp moved out on March 1. Spring rain turned the Iowa prairie to mud, and the three hundred miles to the Missouri River took until the middle of June. Along the way the Saints built way stations at Garden Grove and Mount Pisgah and planted crops for those who would follow. In April, on hearing that his wife had given birth safely back in Nauvoo, William Clayton wrote the hymn "Come, Come, Ye Saints."

    At the Missouri River about five hundred men enlisted in the United States Army as the Mormon Battalion, and their pay helped to fund the migration. In September the last Saints in Nauvoo, mostly the poor and the sick, were driven out by force.
  significance: >-
    The exodus began one of the largest organized migrations in American
    history. Crossing Iowa in 1846 was harder and slower than crossing the
    plains would be the following year, and it kept the Saints from reaching
    the mountains that season.

winter-quarters-established:
  background: >-
    By the time the Saints reached the Missouri River in the summer of 1846,
    it was too late in the year to cross the plains, and five hundred of their
    strongest men had marched away with the Mormon Battalion. Thousands of
    people needed shelter before winter. Church leaders obtained permission
    from leaders of the Omaha nation to stay for a time on the west bank.
  account: |-
    The site was chosen in September 1846, in what is now the north of Omaha, Nebraska. In a few months the Saints laid out streets and built hundreds of log cabins and sod houses for about four thousand people. The town was divided into wards, each with a bishop to look after the poor. A gristmill, workshops and schools were set up.

    The winter was deadly. People already weakened by the Iowa crossing lived on corn bread and salt pork without fresh food, and scurvy, fever and exposure killed several hundred there and in the camps across the river.

    Life went on all the same. The women met in each other's cabins to pray and bless one another, as Eliza R. Snow recorded in her diary. Mary Fielding Smith, Hyrum Smith's widow, spent the winter there with her children before going west in 1848.
  significance: >-
    Winter Quarters was the staging ground for the pioneer journey of 1847 and
    the place where Brigham Young received the revelation on organizing the
    companies. A cemetery and a temple now stand on the site.

word-and-will-of-the-lord:
  background: >-
    Through the winter of 1846–47 the leaders at Winter Quarters planned the
    journey to the Rocky Mountains. The crossing of Iowa had been disorderly
    and slow, and thousands of people in scattered camps now had to be moved
    more than a thousand miles.
  account: |-
    On January 14, 1847, Brigham Young presented a revelation that begins, "The Word and Will of the Lord concerning the Camp of Israel in their journeyings to the West." It is now Doctrine and Covenants 136.

    It directs the Saints to organize into companies with captains over hundreds, fifties and tens, all under the direction of the Twelve. Each company was to take its share of the poor, the widows and the families of the men in the Battalion, and to build houses and plant fields for those who would come after.

    Much of it is about how to travel together: keep your promises, return what you borrow, do not quarrel or speak evil of one another. "If thou art merry, praise the Lord with singing, with music, with dancing." "If thou art sorrowful, call on the Lord thy God." The councils and camps accepted it over the following days.
  significance: >-
    This is the only section of the Doctrine and Covenants received through
    Brigham Young. It gave the migration its organization for the next twenty
    years and confirmed for the Saints that revelation continued after Joseph
    Smith.

pioneer-company-departs:
  background: >-
    Brigham Young planned to send a small, fast company ahead in the spring of
    1847 to find the place, mark the road and plant crops, with the large
    companies of families to follow in the summer.
  account: |-
    The first wagons rolled out of Winter Quarters at the beginning of April 1847, and the company finally got away from its gathering place on the Elkhorn River in the middle of the month. It numbered 143 men, three women and two children, with seventy-odd wagons.

    They kept to the north bank of the Platte River, away from the Oregon Trail traffic on the south side, breaking a new road. The camp ran by rule: a bugle at five in the morning, prayers, wagons moving by seven and drawn into a circle at night. To measure the distance, William Clayton and Orson Pratt designed a set of wooden gears, built by Appleton Harmon, that counted the turns of a wagon wheel.

    They reached Fort Laramie at the beginning of June and crossed the Continental Divide at South Pass. Mountain men they met, including Jim Bridger, gave mixed reports of the Salt Lake Valley. From Fort Bridger they followed a rough track cut the year before by a California-bound party and hacked their way through the canyons of the Wasatch Mountains.
  significance: >-
    The route the company opened became the Mormon Trail. William Clayton's
    guide to it, with distances measured to the quarter mile, was used by
    thousands of later travellers.

arrival-in-salt-lake-valley:
  background: >-
    Near the end of the journey many in the pioneer company, Brigham Young
    among them, came down with a fever. He sent an advance party ahead through
    the last canyons while he followed slowly with the sick.
  account: |-
    Orson Pratt and Erastus Snow were the first to enter the valley, on July 21, 1847. The main body of the company followed the next day. On July 23 they camped by a creek, offered a prayer dedicating the land, and by afternoon were plowing. The ground was so hard that it broke plows, so they dammed the creek and flooded it, and then planted potatoes.

    Brigham Young came out of the canyon on July 24, lying in Wilford Woodruff's carriage. Wilford Woodruff recalled years later that Brigham looked out over the valley for some minutes and then said, "This is the right place. Drive on."

    The company had travelled more than a thousand miles in 111 days. Within a week they had laid out a city, and by autumn well over a thousand more people had arrived.
  significance: >-
    The arrival ended the long search for a place where the Saints could
    settle undisturbed. About seventy thousand pioneers followed before the
    railroad was completed in 1869. July 24 is kept in Utah as Pioneer Day.

salt-lake-temple-site-chosen:
  background: >-
    A temple was in Brigham Young's mind before the pioneers had built a
    single house. In their first days in the valley, parties explored in
    every direction to decide where the city should be.
  account: |-
    On the evening of July 28, 1847, four days after he arrived, Brigham Young walked with several of the Twelve to a spot between two branches of City Creek. By Wilford Woodruff's account, he struck the ground with his cane and said, "Here we will build a temple to our God." Wilford Woodruff drove a stake to mark the place.

    The same evening the apostles decided that the city would be laid out from that block, in squares, with wide streets running with the points of the compass. Salt Lake City's addresses are still counted from Temple Square.

    Ground was broken in February 1853 and the cornerstones were laid on April 6 of that year. The foundation was buried for a time in 1858, when a federal army approached, and was later relaid. Granite was hauled from a canyon twenty miles away, at first by ox team. Wilford Woodruff, by then President of the Church, dedicated the temple on April 6, 1893.
  significance: >-
    The Salt Lake Temple took forty years to build and became the best-known
    symbol of the Church. Choosing the site first, and planning the city
    around it, showed what the Saints had come to the valley to do.

first-presidency-reorganized:
  background: >-
    For three and a half years after Joseph Smith's death, the Quorum of the
    Twelve led the Church together, with Brigham Young as its president. In
    the autumn of 1847 he returned from the Salt Lake Valley to the camps on
    the Missouri River to bring on the rest of the Saints, and raised with
    the Twelve the question of forming a First Presidency again.
  account: |-
    On December 5, 1847, nine of the apostles met at Orson Hyde's house on the Iowa side of the river. After a long discussion they voted to sustain Brigham Young as President of the Church. He named Heber C. Kimball and Willard Richards as his counselors.

    No building in the settlement could hold a conference, so the Saints put up a large log tabernacle in about three weeks. There, on December 27, 1847, about a thousand members voted to sustain the new First Presidency. The Saints in the Salt Lake Valley and in Britain did the same the following year.

    Brigham Young led a large company west in 1848 and did not come back to the Missouri River again.
  significance: >-
    The reorganization settled how the Church is led when its president dies:
    the Twelve preside, and the senior apostle becomes the next president with
    a new First Presidency. Every succession since has followed it.
