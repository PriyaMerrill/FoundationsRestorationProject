# The longer write-up of each person, place and revelation, by slug.
#
# Under each slug is a list of headings, each with its text. They are shown in
# this order. Leave a blank line between paragraphs.

people:
  joseph-smith:
    Early life: |-
      Joseph Smith was born on December 23, 1805, in Sharon, Vermont, the fifth of eleven children of Joseph Smith Sr. and Lucy Mack Smith. The family farmed rented land and moved often. At about seven he survived a serious bone infection in his leg, and an operation without anesthetic left him on crutches for years.

      After repeated crop failures the family moved to western New York, settling near Palmyra around 1816. Joseph had little schooling and worked on the family farm and as a hired hand. In January 1827 he married Emma Hale of Harmony, Pennsylvania.
    In the Restoration: |-
      Joseph Smith said that in 1820, at fourteen, he saw God the Father and Jesus Christ in answer to prayer. Beginning in 1823 he was visited by the angel Moroni, and in 1827 he received the gold plates from which he translated the Book of Mormon, published in 1830. He and Oliver Cowdery said they received priesthood authority from heavenly messengers in 1829.

      He organized the Church on April 6, 1830, and led it for fourteen years: in New York, in Kirtland, Ohio, where the first temple was built, in Missouri, and in Nauvoo, Illinois. He dictated most of the revelations in the Doctrine and Covenants, worked on an inspired translation of the Bible, sent missionaries across North America and to Britain, and introduced temple ordinances.

      Those years brought constant opposition. He was tarred and feathered in 1832, held for more than five months in Missouri in 1838 and 1839, and faced dozens of lawsuits.
    Last years and death: |-
      In Nauvoo he was mayor of the city and lieutenant general of its militia, and in 1844 he announced a campaign for president of the United States. After the city council ordered the destruction of an opposition newspaper's press, he was jailed at Carthage, Illinois. A mob killed him and his brother Hyrum there on June 27, 1844. He was thirty-eight.

      He and Emma had eleven children, two of them adopted. Five lived to adulthood.

  emma-smith:
    Early life: |-
      Emma Hale was born on July 10, 1804, in Harmony, Pennsylvania, the seventh of nine children of Isaac and Elizabeth Hale. Her family were among the first settlers of the Susquehanna valley. She was better educated than most women of her time and place, and may have taught school.

      She met Joseph Smith when he boarded at her father's house in 1825. Isaac Hale refused his consent, and the couple married without it on January 18, 1827.
    In the Restoration: |-
      Emma went with Joseph on the night he received the plates and was one of his first scribes. She never saw the plates uncovered, but said she moved them as she cleaned, felt their shape through a linen cloth and heard the leaves rustle.

      She was baptized in June 1830. A revelation the next month, now Doctrine and Covenants 25, called her "an elect lady" and asked her to choose hymns for the Church; her hymnbook, with ninety hymns, was printed in Kirtland.

      She moved her household from Pennsylvania to New York, Ohio, Missouri and Illinois, often with strangers and the sick under her roof. She buried six of her eleven children in infancy or childhood. In the winter of 1839, with Joseph in jail, she walked across the frozen Mississippi with her children. In 1842 she became the first president of the Relief Society.
    Later years: |-
      After Joseph's death Emma did not go west. She disagreed with Brigham Young over the settlement of Joseph's estate and over plural marriage, which she opposed. She stayed in Nauvoo, raised her children, cared for Joseph's mother and in 1847 married Lewis Bidamon.

      In 1860 her eldest son, Joseph Smith III, became president of the Reorganized Church. She died in Nauvoo on April 30, 1879, and is buried beside Joseph. To the end she affirmed that the Book of Mormon was of God.

  hyrum-smith:
    Early life: |-
      Hyrum Smith was born on February 9, 1800, in Tunbridge, Vermont, the second surviving son of Joseph Smith Sr. and Lucy Mack Smith. As a boy he attended an academy in Hanover, New Hampshire, and he nursed his younger brother Joseph through the leg infection that nearly killed him.

      He married Jerusha Barden in 1826 and farmed near his parents at Palmyra.
    In the Restoration: |-
      Hyrum believed his brother from the start. He was one of the Eight Witnesses who handled the plates, helped see the Book of Mormon through the press, and was one of the six men named when the Church was organized.

      In Kirtland he served on the committee that built the temple and is remembered as the first to break ground for it. He marched with Zion's Camp and became a counselor to Joseph in 1837. That year Jerusha died, leaving him with five children, and he married Mary Fielding.

      He was arrested at Far West in 1838 and spent the winter in Liberty Jail with Joseph. In 1841 a revelation called him to be Patriarch to the Church, the office his father had held, and Assistant President.
    Death and family: |-
      Hyrum refused to leave Joseph when he went to Carthage in June 1844. He was the first to be shot when the mob stormed the jail on June 27, and died at forty-four.

      Joseph said of him that he had the mildness of a lamb and the integrity of Job. His son Joseph F. Smith and his grandson Joseph Fielding Smith both became Presidents of the Church.

  lucy-mack-smith:
    Early life: |-
      Lucy Mack was born on July 8, 1775, in Gilsum, New Hampshire, the youngest of eight children. She married Joseph Smith Sr. in Tunbridge, Vermont, in January 1796. They had eleven children, nine of whom lived past infancy.

      The family lost their farm after a failed business venture and spent years as tenant farmers in Vermont and New Hampshire before moving to Palmyra, New York. Lucy was a determined seeker in religion and taught her children from the Bible.
    In the Restoration: |-
      Lucy believed her son Joseph's account of his visions and gave her home and her labor to the work. Her memories are the source of much of what is known about the family in those years: the evenings Joseph described what he had been taught, the hiding of the plates, the day the manuscript was lost.

      She was baptized on the day the Church was organized. In 1831 she led a company of about eighty New York members by canal boat and lake steamer to Ohio, and by her own account held them together when the ice at Buffalo threatened to strand them.

      She followed the Church to Missouri and Illinois. Her husband died in Nauvoo in 1840.
    Later years: |-
      In the summer of 1844 Lucy lost three sons within five weeks: Joseph and Hyrum at Carthage, and Samuel, who died of illness soon after. That winter she dictated her history to a scribe. It was published in England in 1853.

      She stayed in Nauvoo, cared for by her daughter-in-law Emma, and died there on May 14, 1856, at eighty.

  joseph-smith-sr:
    Early life: |-
      Joseph Smith Sr. was born on July 12, 1771, in Topsfield, Massachusetts, and grew up in Vermont. He married Lucy Mack in 1796. He farmed, taught school in the winters and worked as a cooper.

      An investment in exporting ginseng went wrong and cost the family their farm. After the cold summer of 1816 ruined a third harvest in a row, he went ahead to Palmyra, New York, and sent for his family. He held aloof from the churches but had vivid religious dreams, which Lucy recorded.
    In the Restoration: |-
      When his son Joseph told him of Moroni's visit in 1823, his answer was that it was of God and that Joseph should do as he had been told. He was one of the Eight Witnesses of the plates and was baptized on April 6, 1830; his son wept for joy to see it.

      He served a mission to his own relatives in New York, was jailed briefly for a small debt after refusing to deny the Book of Mormon, and moved to Kirtland in 1831. In December 1833 he was ordained the first Patriarch to the Church, and he gave hundreds of blessings. He became an assistant counselor to his son in 1837.
    Last years: |-
      He left Kirtland in 1838 and was driven from Missouri the following winter, walking much of the way to Illinois in poor health. He never recovered. He died in Nauvoo on September 14, 1840, after blessing each of his children.

  oliver-cowdery:
    Early life: |-
      Oliver Cowdery was born on October 3, 1806, in Wells, Vermont, the youngest of eight children. He followed his older brothers to western New York, where he worked as a store clerk and then as a schoolteacher in the district where the Smith family lived. He boarded with them in the winter of 1828–29 and learned about the plates.
    In the Restoration: |-
      Oliver reached Harmony in April 1829 and wrote nearly all of the Book of Mormon manuscript as Joseph Smith dictated. With Joseph he received the Aaronic Priesthood from John the Baptist and the Melchizedek Priesthood from Peter, James and John. He was one of the Three Witnesses.

      When the Church was organized he was its "second elder." He led the first long mission, to the western frontier, in 1830. In Kirtland he edited the Church's newspapers, helped prepare the revelations for printing and in 1834 was made Assistant President. He was with Joseph in the Kirtland Temple on April 3, 1836.
    Separation and return: |-
      In 1838, after disagreements with Joseph Smith and other leaders over Church government and his own business affairs, Oliver was excommunicated at Far West. He practiced law in Ohio and Wisconsin for ten years.

      In 1848 he came to the Saints' camp at Kanesville, Iowa, asked to be received again and was rebaptized. He meant to go west but died of a lung illness on March 3, 1850, in Richmond, Missouri, at the home of his wife's family, the Whitmers. He never withdrew his testimony of the Book of Mormon.

  martin-harris:
    Early life: |-
      Martin Harris was born on May 18, 1783, in Easttown, New York, and came to Palmyra as a child. By the 1820s he was one of the town's prosperous farmers, known for his honesty and for his deep interest in religion. He had employed Joseph Smith and his father as laborers.
    In the Restoration: |-
      Martin gave Joseph and Emma Smith the money to move to Pennsylvania in 1827. Early in 1828 he carried a copy of characters from the plates to scholars in New York City, and came back satisfied. He then served as scribe for the first 116 pages of the translation and lost them, the great regret of his life.

      In June 1829 he was shown the plates as one of the Three Witnesses. He mortgaged his farm to pay for printing the Book of Mormon and sold much of it to meet the bill. He was baptized on the day the Church was organized, marched with Zion's Camp and helped to choose the first Twelve Apostles.
    Later years: |-
      Martin parted from the Church during the troubles in Kirtland in 1837. When the Saints left, he stayed, for more than thirty years, and showed visitors through the empty temple.

      In 1870, at eighty-seven, he travelled to Utah, where he was rebaptized. He died in Clarkston, Utah, on July 10, 1875, at ninety-two. In all those years, in or out of the Church, he repeated to anyone who asked that he had seen the angel and the plates.

  david-whitmer:
    Early life: |-
      David Whitmer was born on January 7, 1805, near Harrisburg, Pennsylvania, and grew up on his parents' farm at Fayette, New York. He heard of the plates through his friend Oliver Cowdery and in June 1829 drove a wagon to Pennsylvania to bring Joseph and Oliver to his father's house.
    In the Restoration: |-
      The translation was finished in the Whitmer home, and David was one of the Three Witnesses shown the plates nearby. He was one of the six men named when the Church was organized in his father's house.

      He moved with the Church to Ohio and then to Missouri, where he was driven from Jackson County in 1833. In 1834 Joseph Smith appointed him president of the Church in Missouri. He helped to choose the first Twelve Apostles in 1835.
    Later years: |-
      During the conflicts of 1837 and 1838 David came into disagreement with Joseph Smith, and in April 1838 he was excommunicated at Far West. He never returned.

      He settled in Richmond, Missouri, where he ran a livery stable for fifty years and was respected enough to be elected mayor. Hundreds of visitors came to question him. He told them all the same thing, and in 1887 published it: that he had seen the plates and the angel and that the Book of Mormon was true. He died on January 25, 1888, the last of the Three Witnesses.

  sidney-rigdon:
    Early life: |-
      Sidney Rigdon was born on February 19, 1793, on a farm near Pittsburgh, Pennsylvania. He became a Baptist minister and a celebrated preacher, then joined the movement led by Alexander Campbell that sought to restore New Testament Christianity. By 1830 he led congregations around Mentor and Kirtland, Ohio.
    In the Restoration: |-
      In the fall of 1830 his former follower Parley P. Pratt brought him a Book of Mormon. Sidney read it, was baptized and brought much of his congregation with him. He went to New York to meet Joseph Smith and became his scribe for the translation of the Bible.

      He shared with Joseph the vision of the degrees of glory in 1832 and was dragged from his house and badly injured by the mob at Hiram a month later. From 1833 he was a counselor in the First Presidency. He was the Church's leading orator, and preached at the dedication of the Kirtland Temple.

      He was imprisoned in Liberty Jail in the winter of 1838–39 and released early because of illness. His health and his closeness to Joseph both declined in Nauvoo.
    Later years: |-
      After Joseph Smith's death, Sidney offered himself as guardian of the Church. The Saints chose to follow the Twelve. He was excommunicated in September 1844 and led a small church of his own in Pennsylvania, which soon broke up.

      He died in Friendship, New York, on July 14, 1876.

  brigham-young:
    Early life: |-
      Brigham Young was born on June 1, 1801, in Whitingham, Vermont, the ninth of eleven children, and grew up poor in western New York. He had eleven days of formal schooling by his own count. He became a carpenter, joiner, painter and glazier.

      He first saw a Book of Mormon in 1830 and studied it for two years before he was baptized, in April 1832. His wife Miriam died that autumn. He went to Kirtland to meet Joseph Smith and gave him his loyalty for life.
    In the Restoration: |-
      Brigham marched with Zion's Camp in 1834 and was called as one of the first Twelve Apostles in 1835. He worked on the Kirtland Temple and defended Joseph Smith when many in Kirtland turned against him.

      With Joseph in jail in the winter of 1838–39, he organized the exodus of the Saints from Missouri. He then led the Twelve's mission to Britain, where thousands were baptized. By 1841 he was President of the Twelve.
    Leading the Church: |-
      After Joseph Smith's death in 1844, the Saints voted to follow the Twelve with Brigham at their head. He finished the Nauvoo Temple, led the exodus across Iowa in 1846 and brought the first pioneer company to the Salt Lake Valley in July 1847. That December he was sustained as President of the Church.

      Over the next thirty years he directed the migration of some seventy thousand people and the founding of several hundred settlements across the West. He was the first governor of Utah Territory. He died in Salt Lake City on August 29, 1877.

  heber-c-kimball:
    Early life: |-
      Heber C. Kimball was born on June 14, 1801, in Sheldon, Vermont. He learned blacksmithing from his father and pottery from his brother, and set up as a potter in Mendon, New York, where Brigham Young became his neighbor and closest friend. The two were baptized within days of each other in April 1832.
    In the Restoration: |-
      Heber marched with Zion's Camp and was called to the first Quorum of the Twelve in 1835. In 1837 Joseph Smith sent him to open the mission in England. He went with no money and little confidence, and within nine months about fifteen hundred people had joined the Church. He returned to Britain with the Twelve in 1840.

      He helped Brigham Young bring the Saints out of Missouri in 1839, and was among the first to receive temple ordinances from Joseph Smith in Nauvoo. In the winter of 1845–46 he worked day and night in the Nauvoo Temple.
    Later years: |-
      Heber came west with the pioneer company of 1847. That December he became First Counselor to Brigham Young, and he served for more than twenty years. He was known for plain, vivid speech and for sayings the Saints took as prophecy.

      He died in Salt Lake City on June 22, 1868, after a carriage accident.

  parley-p-pratt:
    Early life: |-
      Parley Parker Pratt was born on April 12, 1807, in Burlington, New York. He cleared a farm in the Ohio woods and joined Sidney Rigdon's congregation. In 1830, feeling called to preach, he sold the farm and travelled east. On the way he was lent a Book of Mormon, read it almost without stopping, and went to Palmyra to find out more. He was baptized in Seneca Lake that September.
    In the Restoration: |-
      Within weeks he was on the mission to the western frontier, and it was he who led his companions to Sidney Rigdon in Ohio. He was driven from Jackson County, marched with Zion's Camp and became one of the first Twelve Apostles in 1835. His younger brother Orson was another.

      On a mission to Toronto in 1836 he baptized John Taylor and the Fielding family. He was arrested at Far West in 1838 and spent eight months in Missouri jails before escaping on the Fourth of July, 1839. In England he founded and edited the Millennial Star.

      He was the most widely read Latter-day Saint writer of his day. His Voice of Warning (1837) was reprinted for decades, and several of his hymns are still sung.
    Later years: |-
      Parley led a company to the Salt Lake Valley in 1847, explored southern Utah, and opened a mission to Chile in 1851. He was killed on May 13, 1857, near Van Buren, Arkansas, while on a mission to the eastern states. His autobiography was published after his death.

  edward-partridge:
    Early life: |-
      Edward Partridge was born on August 27, 1793, in Pittsfield, Massachusetts. He learned the hatter's trade and built a successful business in Painesville, Ohio, near Kirtland. He and his wife, Lydia, belonged to Sidney Rigdon's congregation.
    In the Restoration: |-
      When the missionaries came in 1830, Lydia was baptized but Edward wanted to see for himself. He travelled to New York with Sidney Rigdon, met Joseph Smith and was baptized by him that December.

      On February 4, 1831, a revelation called him as the first bishop of the Church and compared him to Nathanael, "in whom there is no guile." He gave up his business. That summer he went to Missouri, where he bought land and gave out stewardships under the law of consecration.

      In July 1833 a mob in Independence dragged him to the public square and tarred and feathered him. Witnesses said he bore it so quietly that the crowd fell silent. He was driven out with the Saints that autumn and led them in Clay County and at Far West.
    Last years: |-
      Edward was jailed for several weeks in the autumn of 1838 and expelled from Missouri that winter. He served as a bishop in Nauvoo, but his health was broken. He died there on May 27, 1840, at forty-six.

  newel-k-whitney:
    Early life: |-
      Newel Kimball Whitney was born on February 5, 1795, in Marlborough, Vermont. He went west as a young trader, and by the 1820s he and his partner, Sidney Gilbert, ran a store in Kirtland, Ohio. He married Elizabeth Ann Smith in 1822. Both joined Sidney Rigdon's congregation and were baptized when the missionaries came in November 1830.
    In the Restoration: |-
      The Whitneys took Joseph and Emma Smith into their home when they arrived in Kirtland in February 1831. Rooms in the Whitney store became Joseph's office and, for a time, his home. The School of the Prophets met upstairs, and several revelations, including the Word of Wisdom, were received there.

      In December 1831 Newel was called as bishop in Kirtland, the second bishop in the Church. He managed the storehouse and the Church's business affairs. In 1832 he travelled with Joseph to Missouri and broke his leg in a stagecoach accident on the way home.

      He followed the Church to Illinois and served as a bishop in Nauvoo.
    Later years: |-
      Newel crossed the plains in 1848, having been named Presiding Bishop of the Church the year before. He died in Salt Lake City on September 23, 1850.

  john-taylor:
    Early life: |-
      John Taylor was born on November 1, 1808, in Milnthorpe, in the north of England. He was apprenticed as a cooper and then as a wood turner, and became a Methodist lay preacher at seventeen. In 1832 he followed his parents to Toronto, Canada, where he married Leonora Cannon and joined a group who were studying the Bible for a truer form of Christianity.
    In the Restoration: |-
      Parley P. Pratt came to Toronto in 1836. John compared his teaching with the scriptures for three weeks and was baptized with Leonora. He was called as an apostle in 1838.

      He served in Britain with the Twelve in 1840, preaching in Liverpool, Ireland and the Isle of Man. In Nauvoo he edited the Church's newspapers.

      He went to Carthage with Joseph and Hyrum Smith in June 1844 and was in the room when they were killed. He was shot four times and carried the wounds for life. His account of that day is now Doctrine and Covenants 135.
    Later years: |-
      John Taylor came to the Salt Lake Valley in 1847. He opened missions in France and Germany and oversaw translations of the Book of Mormon into French and German.

      He led the Church as President of the Twelve after Brigham Young's death in 1877 and became President of the Church in 1880. His last years were spent in hiding during the federal campaign against plural marriage. He died in Kaysville, Utah, on July 25, 1887.

  wilford-woodruff:
    Early life: |-
      Wilford Woodruff was born on March 1, 1807, in Farmington, Connecticut, and followed his father's trade as a miller. He read the Bible closely and belonged to no church, waiting, he said, for one with prophets and apostles. He heard two Latter-day Saint missionaries preach in a schoolhouse in upstate New York in December 1833 and was baptized two days later.
    In the Restoration: |-
      Wilford marched with Zion's Camp within months of his baptism and then spent years as a missionary in the southern states and on the islands off the coast of Maine. He was ordained an apostle at Far West on April 26, 1839.

      In England in 1840 he went to Herefordshire and baptized hundreds within a few months, among them almost an entire congregation of independent Methodists.

      From 1835 until his death he kept a daily journal. It runs to thousands of pages and is one of the most important records of the early Church, including many of Joseph Smith's sermons.
    Later years: |-
      Wilford came west with the pioneer company of 1847; Brigham Young was riding in his carriage when he first saw the Salt Lake Valley. He became President of the Church in 1889.

      In 1890 he issued the Manifesto that led to the end of plural marriage. He dedicated the Salt Lake Temple in 1893 and encouraged the Saints to trace their families and be sealed to their own ancestors. He died on September 2, 1898, in San Francisco.

  willard-richards:
    Early life: |-
      Willard Richards was born on June 24, 1804, in Hopkinton, Massachusetts. He taught school, lectured on science and practiced herbal medicine near Boston. In 1835 he came across a Book of Mormon left by his cousin Brigham Young, read it through twice in ten days and moved to Kirtland. Brigham baptized him on the last day of 1836.
    In the Restoration: |-
      Six months later Willard left with Heber C. Kimball on the first mission to England. He stayed four years, married there, and was ordained an apostle in Preston in April 1840.

      In Nauvoo he became Joseph Smith's private secretary, the Church historian and recorder, and the keeper of Joseph's journal. Much of what is known of Joseph's last years comes from his pen.

      He was in Carthage Jail on June 27, 1844, and came through the attack almost untouched. He carried the wounded John Taylor to safety, wrote the first report to Nauvoo that night and urged the Saints to stay calm.
    Later years: |-
      Willard came west in 1847 and that December became Second Counselor to Brigham Young. He was the first editor of the Deseret News. He died in Salt Lake City on March 11, 1854.

  eliza-r-snow:
    Early life: |-
      Eliza Roxcy Snow was born on January 21, 1804, in Becket, Massachusetts, and grew up in Mantua, Ohio. She was well educated, worked as her father's secretary and published poetry in Ohio newspapers from her early twenties. Her mother and sister joined the Church soon after it came to Ohio. Eliza studied for four years before she was baptized, in April 1835.
    In the Restoration: |-
      Eliza moved to Kirtland, taught school, boarded with Joseph and Emma Smith and gave her inheritance toward the temple. Her younger brother Lorenzo followed her into the Church.

      She was driven from Missouri with her family in 1839. In Nauvoo she wrote the constitution that led to the Relief Society and served as its first secretary; her careful minutes preserve Joseph Smith's teachings to the women. She was sealed to Joseph Smith as a plural wife in 1842.

      The Saints called her "Zion's poetess." She wrote hundreds of poems, among them the words of the hymn "O My Father."
    Later years: |-
      Eliza crossed the plains in 1847, keeping a diary of the journey. In Utah she married Brigham Young.

      From 1867 she travelled throughout the territory helping bishops to organize Relief Societies, using the Nauvoo minute book she had carried west. She became general president of the Relief Society and helped to found the organizations for young women and for children. She died in Salt Lake City on December 5, 1887.

  mary-fielding-smith:
    Early life: |-
      Mary Fielding was born on July 21, 1801, in Honeydon, Bedfordshire, England, into a devout Methodist farming family. In 1834 she joined her brother Joseph and sister Mercy in Canada, near Toronto. All three were baptized in 1836 after hearing Parley P. Pratt preach.
    In the Restoration: |-
      Mary moved to Kirtland in 1837. Her letters to her sister are a vivid record of the divisions there that year. In December 1837 she married Hyrum Smith, whose wife had died two months earlier, and became mother to his five children.

      Hyrum was arrested at Far West in the autumn of 1838. Less than two weeks later Mary gave birth to her first child, Joseph F. Smith. She was dangerously ill for months. She was taken to Liberty Jail so that Hyrum could see his son, and was then carried out of Missouri on a bed in a wagon.

      In Nauvoo she and Mercy organized the women to give a penny a week for glass and nails for the temple.
    Later years: |-
      Hyrum was killed in 1844. Mary left Nauvoo in 1846 and spent two winters at Winter Quarters. In 1848 she brought her family across the plains with too few oxen and against the advice of her company's captain. Her son long remembered her prayers on that journey.

      She built a home and farm in the Salt Lake Valley and died there on September 21, 1852, at fifty-one. Her son Joseph F. Smith became President of the Church in 1901.

places:
  palmyra:
    The place then: |-
      Palmyra was a growing village in western New York, and the Erie Canal reached it in 1822. The Smith family arrived around 1816 with almost nothing. Within a few years they had contracted for a hundred acres of forest just over the town line in Manchester, built a log house, and cleared the land for wheat, an orchard and maple sugar.

      The region saw so many religious revivals that it was later called the "burned-over district."
    What happened here: |-
      In a grove on the family farm, in the spring of 1820, Joseph Smith prayed and saw the Father and the Son. In the log house in September 1823 he was visited by the angel Moroni, who sent him to a hill about three miles to the south. He received the gold plates there four years later.

      The Book of Mormon was printed in 1829 and 1830 in E. B. Grandin's shop on Palmyra's main street. Martin Harris, who paid for it, farmed just north of the village. The Eight Witnesses were shown the plates near the Smith home.
    The place today: |-
      The Church maintains the Smith farm, with its rebuilt log house and restored frame house, the Sacred Grove, the Hill Cumorah and the Grandin printing shop as historic sites. A temple was dedicated at Palmyra in 2000, on land that was part of the Smith farm.

  harmony:
    The place then: |-
      Harmony was a township of scattered farms in the hills of northeastern Pennsylvania, along a bend of the Susquehanna River just south of the New York line. Isaac Hale, Emma's father, was one of its first settlers and a noted hunter.

      Joseph and Emma Smith came in December 1827 to get away from the harassment in Palmyra. They bought a small house and thirteen acres from her father, a few hundred yards from her parents' home.
    What happened here: |-
      Joseph Smith began translating the plates here in the winter of 1827–28, with Emma, her brother and then Martin Harris as scribes. The first 116 pages were written, and lost. Joseph and Emma's first child was born here in June 1828, died the same day, and is buried nearby.

      Oliver Cowdery arrived in April 1829, and most of the Book of Mormon was dictated in the Smiths' house over the next two months. On May 15, 1829, John the Baptist conferred the Aaronic Priesthood on the two men by the river, and they baptized each other in it. Fifteen of the earliest revelations in the Doctrine and Covenants were received in Harmony.

      Opposition drove them to Fayette in June 1829. Joseph and Emma left Harmony for the last time in 1830.
    The place today: |-
      The township is now called Oakland. The Church opened the Priesthood Restoration Site there in 2015, with the homes of Joseph and Emma Smith and of the Hales rebuilt on their original foundations and a path to the river.

  fayette:
    The place then: |-
      Fayette is a farming township between Seneca and Cayuga Lakes in the Finger Lakes region of New York. Peter Whitmer Sr. and his wife, Mary, of Pennsylvania German background, had farmed there since about 1809 and raised eight children in a log house.

      The family knew Oliver Cowdery, and through him took an interest in Joseph Smith's work.
    What happened here: |-
      In June 1829 the Whitmers took in Joseph Smith, Emma and Oliver Cowdery. The translation of the Book of Mormon was finished in an upstairs room. In the woods nearby an angel showed the plates to the Three Witnesses.

      On April 6, 1830, the Church was organized in the Whitmer house. The first three conferences of the Church were held here, and Joseph and Emma lived with the Whitmers for several months in 1830. Nineteen sections of the Doctrine and Covenants were received at Fayette, including the command to gather to Ohio.

      The Whitmers and most of their neighbors who had joined the Church left for Ohio in 1831.
    The place today: |-
      The Church owns the Peter Whitmer farm. A log house was rebuilt on the original site for the Church's 150th anniversary in 1980, and part of that year's general conference was broadcast from it.

  kirtland:
    The place then: |-
      Kirtland was a township of about a thousand people in northeastern Ohio, a few miles from Lake Erie, settled by New Englanders. It had mills along the Chagrin River and a store kept by Newel K. Whitney. Many of its people belonged to Sidney Rigdon's congregation, and more than a hundred of them were baptized within weeks when missionaries came through in November 1830.
    What happened here: |-
      Joseph Smith arrived in February 1831, and Kirtland was the headquarters of the Church until 1838. Its Latter-day Saint population grew to about two thousand.

      More of the Doctrine and Covenants was received here than anywhere else, including the law of the Church, the revelations on priesthood, the "olive leaf" and the Word of Wisdom. The First Presidency, the Quorum of the Twelve and the Seventy were all organized in Kirtland. The School of the Prophets met over the Whitney store. Zion's Camp set out from here in 1834, and the first mission to England in 1837.

      The Saints built the first temple here between 1833 and 1836. It was dedicated on March 27, 1836, and a week later Joseph Smith and Oliver Cowdery recorded the visions that are now Doctrine and Covenants 110.

      The collapse of the Kirtland Safety Society in 1837 split the community, and most of the Saints left for Missouri in 1838.
    The place today: |-
      The temple still stands on its hill. The Church has restored the Whitney store and home and other buildings in the old village as Historic Kirtland, and since 2024 it has also owned the temple.

  hiram:
    The place then: |-
      Hiram is a farming township about thirty miles south of Kirtland. John and Alice Johnson had a prosperous farm there, with one of the largest houses in the neighborhood. They joined the Church in 1831 after, by their account, Joseph Smith healed Alice's arm, which had been lame for years.
    What happened here: |-
      Joseph and Emma Smith moved into the Johnson home in September 1831 so that Joseph could work in quiet on his translation of the Bible. Sidney Rigdon's family lived in a cabin across the road.

      Hiram was in effect the headquarters of the Church for a year. Conferences held in the house in November 1831 decided to publish Joseph Smith's revelations as the Book of Commandments. Sixteen sections of the Doctrine and Covenants were received here, among them the Lord's preface (section 1) and, on February 16, 1832, the vision of the degrees of glory (section 76).

      On the night of March 24, 1832, a mob dragged Joseph from the house and tarred and feathered him. The Smiths left Hiram a few days later, and moved back to Kirtland that year.
    The place today: |-
      The John Johnson home has been restored by the Church and is open to visitors. The upstairs room where the vision was received looks much as it did.

  independence:
    The place then: |-
      Independence was founded in 1827 as the seat of Jackson County, on the western edge of Missouri and of the United States. It was the starting point of the Santa Fe Trail: a rough town of traders, trappers and settlers from the upland South, with a log courthouse and a few stores.
    What happened here: |-
      The first Latter-day Saint missionaries arrived early in 1831. Joseph Smith came that July, and a revelation named Independence the center place of Zion. On August 3, 1831, he dedicated a site for a temple a little west of the courthouse.

      Members gathered quickly. Bishop Edward Partridge bought land and gave out stewardships. William W. Phelps ran a printing office that published the Church's first newspaper and began printing the Book of Commandments. By 1833 about twelve hundred Saints lived in the county.

      That July a mob destroyed the printing office and tarred and feathered the bishop. In November the Saints were driven across the Missouri River. They never returned as a body.
    The place today: |-
      Independence is now part of the Kansas City area. The temple site and the land around it are shared among several churches that trace their origins to Joseph Smith. The Church of Jesus Christ of Latter-day Saints has a visitors' center there.

  liberty:
    The place then: |-
      Liberty is the seat of Clay County, across the Missouri River from Jackson County. Its people took in the Saints driven out of Jackson County in 1833 and let them stay for three years. Alexander Doniphan, the lawyer and militia general who later saved Joseph Smith's life, lived here.

      The county jail, built in 1833, was a two-story stone box with an inner lining of oak logs. The only way into the lower room was through a trapdoor in the floor above.
    What happened here: |-
      Joseph Smith, Hyrum Smith, Sidney Rigdon, Lyman Wight, Caleb Baldwin and Alexander McRae were brought to the jail on December 1, 1838, to await trial on charges arising from the conflict in northern Missouri. They were kept through the winter in the cold, dark lower room.

      In March 1839 Joseph Smith dictated two long letters to the Church. Parts of them are now Doctrine and Covenants 121, 122 and 123.

      The prisoners left Liberty on April 6, 1839, and escaped ten days later while being moved to another county.
    The place today: |-
      The jail fell into ruin, and a house was later built over it. The Church bought the site and opened a visitors' center in 1963, with a cutaway reconstruction of the jail on its original floor.

  far-west:
    The place then: |-
      Far West stood on open prairie in northwestern Missouri. In 1836 the Missouri legislature created Caldwell County as a place for the Latter-day Saints to settle, and Far West was laid out as its seat that summer, a mile square with a temple block at the center.

      Within two years it had perhaps two thousand people in the town and several thousand more on the farms around it.
    What happened here: |-
      Joseph Smith arrived in March 1838 and made Far West the headquarters of the Church. Seven sections of the Doctrine and Covenants were received here, including the revelation that gave the Church its name and the one that established tithing. Cornerstones for a temple were laid on July 4, 1838.

      That autumn the conflict with other Missourians came to a head. State militia surrounded the town, Joseph Smith and other leaders were arrested on October 31, and Far West surrendered the next day. The Saints left over the winter.

      On April 26, 1839, members of the Twelve returned before dawn, held a short conference at the temple site, ordained Wilford Woodruff and George A. Smith apostles, and left for their mission to Britain.
    The place today: |-
      Nothing is left of the town. The temple site is a fenced lawn among farm fields, owned by the Church, with the four cornerstones still in place and monuments telling the story.

  hawns-mill:
    The place then: |-
      Jacob Hawn built a gristmill and sawmill on Shoal Creek in the mid-1830s, about twelve miles east of Far West. By 1838 some thirty Latter-day Saint families lived nearby, and a blacksmith shop and a few cabins stood by the mill. In October 1838 several wagon companies of members arriving from Ohio had stopped there.
    What happened here: |-
      On the afternoon of October 30, 1838, more than two hundred Missouri militiamen attacked the settlement. Seventeen Latter-day Saint men and boys were killed, most of them in or around the blacksmith shop, and more than a dozen people were wounded. The dead were buried the next day in an unfinished well.

      The survivors left with the rest of the Saints that winter. Jacob Hawn moved on to Oregon.
    The place today: |-
      The site is a quiet stretch of creek bottom reached by gravel roads. Nothing of the settlement stands. A marker remembers those who died.

  jefferson-city:
    The place then: |-
      Jefferson City, on the Missouri River in the middle of the state, was laid out in the 1820s to be the capital of Missouri. In 1838 it was still a small town, about a hundred and fifty miles from the counties where the Saints lived. News from there took days to arrive and was often wrong.
    What happened here: |-
      The Latter-day Saints never lived in Jefferson City, but decisions made here shaped their years in Missouri. Their appeals went to the governor here after they were driven from Jackson County in 1833.

      On October 27, 1838, acting on alarming reports from the northwest of the state, Governor Lilburn W. Boggs signed the order here that directed the militia to treat the Saints as enemies and to exterminate them or drive them from Missouri. Later that winter the legislature received the Saints' petitions for redress and set them aside.
    The place today: |-
      Jefferson City is still the state capital. The order of 1838 was rescinded by Governor Christopher S. Bond on June 25, 1976. The original document is kept in the Missouri State Archives.

  nauvoo:
    The place then: |-
      In 1839 the place was Commerce, Illinois: a handful of houses on a marshy flat where the Mississippi River makes a wide bend, with wooded bluffs behind. The Church bought the land on credit that spring. Joseph Smith renamed it Nauvoo.

      The Saints drained the flat, laid out streets and built brick homes, shops, mills and a river landing. By 1844 about twelve thousand people lived in the city.
    What happened here: |-
      Nauvoo was the headquarters of the Church from 1839 to 1846. Its city charter gave it its own courts and militia. Thousands of converts arrived from Britain by way of New Orleans and the river.

      Here Joseph Smith taught baptism for the dead, organized the Relief Society in 1842, introduced the temple endowment and the sealing of families, and gave some of his best-known sermons. Seven sections of the Doctrine and Covenants come from Nauvoo. The temple on the bluff was begun in 1841.

      After Joseph and Hyrum Smith were killed at Carthage in June 1844, the Saints followed the Twelve, finished the temple and received their ordinances in it. The first wagons crossed the river on February 4, 1846. The last residents were driven out that September.
    The place today: |-
      Much of the old city on the flat has been restored, with homes and shops open to visitors. The temple, destroyed by fire and storm after the Saints left, was rebuilt on its original site and dedicated in 2002. Joseph, Emma and Hyrum Smith are buried near the river.

  carthage:
    The place then: |-
      Carthage is the seat of Hancock County, Illinois, about twenty miles southeast of Nauvoo. In the 1840s it was a small town and a center of opposition to the Latter-day Saints, whose city had come to outnumber the rest of the county.

      The jail, finished about 1841, was a two-story stone building. The jailer's family lived in it, with a cell and a debtors' room on the ground floor and a bedroom and an iron-barred cell upstairs.
    What happened here: |-
      Joseph and Hyrum Smith came to Carthage on June 24, 1844, to answer a charge of riot. They were then charged with treason and committed to the jail. The jailer let them use his own upstairs bedroom, which had an ordinary wooden door and no bars. John Taylor and Willard Richards stayed with them.

      Late in the afternoon of June 27, with the governor away, a mob of armed men with blackened faces overran the guard and rushed up the stairs. Hyrum was killed by a shot through the door. Joseph was shot at the window and fell to the ground below. John Taylor was badly wounded.
    The place today: |-
      The jail has belonged to the Church since 1903 and has been restored to its appearance in 1844. Visitors can go into the upstairs room. The door still has the bullet hole.

  kanesville:
    The place then: |-
      When the Saints reached the Missouri River in June 1846, the bluffs on the Iowa side were Potawatomi land with a trading post and little else. The main camp crossed to Winter Quarters, but thousands stayed on the east bank in dozens of small farming settlements. The largest, in a hollow in the bluffs, was first called Miller's Hollow.
    What happened here: |-
      The Mormon Battalion was enlisted near here in July 1846. When Winter Quarters had to be given up in 1848, those who could not yet go west moved back across the river, and the town was renamed Kanesville for Thomas L. Kane, a friend of the Saints from Philadelphia.

      In December 1847 the Saints built a large log tabernacle here in about three weeks, and in it, on December 27, Brigham Young was sustained as President of the Church. Oliver Cowdery returned to the Church here in 1848.

      Under the apostle Orson Hyde, Kanesville was for five years the chief outfitting point for Latter-day Saint companies crossing the plains, and a busy one for gold seekers. In 1852 the remaining Saints were called to Utah.
    The place today: |-
      The town was renamed Council Bluffs in 1853 and grew into a railroad city. Markers and a small historic site recall the Kanesville years.

  winter-quarters:
    The place then: |-
      The west bank of the Missouri River was Indian country in 1846, closed to settlement. With winter coming and five hundred men gone with the Mormon Battalion, Brigham Young obtained leave from leaders of the Omaha nation and from federal officers to stay for two years. In September the Saints chose a bench of land above the river.
    What happened here: |-
      By December 1846 there was a town of several hundred log cabins and sod dugouts, with about four thousand people. It was laid out in blocks and divided into wards, each under a bishop.

      Hunger, exposure and disease killed several hundred people here and in the camps across the river that winter and the next.

      On January 14, 1847, Brigham Young received the revelation on organizing the companies, now Doctrine and Covenants 136. The pioneer company left in April, and larger companies followed in June. Brigham Young returned in the autumn and led another large company west in 1848, when the settlement was abandoned.
    The place today: |-
      The site is in Florence, a neighborhood in the north of Omaha, Nebraska. The pioneer cemetery, with a monument to the families who buried their dead there, sits beside a visitors' center and the Winter Quarters Nebraska Temple, dedicated in 2001.

  salt-lake-city:
    The place then: |-
      In 1847 the Salt Lake Valley was a dry plain between the Wasatch Mountains and the Great Salt Lake, crossed by a few streams. It was part of Mexico, used by Ute and Shoshone peoples, and a thousand miles from the nearest American settlements. Its isolation was the reason Brigham Young chose it.
    What happened here: |-
      The first of the pioneer company entered the valley on July 21 and 22, 1847, and began plowing and irrigating at once. Brigham Young arrived on July 24. Four days later he marked the place for a temple, and the city was laid out around it.

      About seventeen hundred people spent the first winter in a fort of log and adobe houses. In 1848 crickets devoured much of the first full crop before flocks of gulls arrived and ate them, an event the Saints remembered as a deliverance.

      Salt Lake City became the headquarters of the Church and the hub of several hundred settlements. Until the railroad came in 1869, tens of thousands of converts arrived by wagon and handcart. The temple, begun in 1853, was dedicated in 1893.
    The place today: |-
      Salt Lake City is the capital of Utah and the world headquarters of the Church. Temple Square, with the temple, the Tabernacle and the Church's offices, stands where Brigham Young marked the spot. A park at the mouth of Emigration Canyon marks where the pioneers entered the valley.

revelations:
  dc-3:
    Background: |-
      In the spring of 1828 Martin Harris wrote for Joseph Smith as he translated the first part of the Book of Mormon. Martin asked to take the 116 pages of manuscript home to convince his family. Joseph asked the Lord, was refused twice, and asked a third time. Martin took the pages to Palmyra, and they disappeared.

      Joseph was left without the plates or the means to translate. In July 1828, at Harmony, the interpreters were returned to him and he received this revelation, the earliest in the Doctrine and Covenants to have been written down at the time.
    What it says: |-
      It opens with a statement of confidence: "The works, and the designs, and the purposes of God cannot be frustrated." It is people who fail, not God.

      It then speaks plainly to Joseph. He had been entrusted with sacred things and had "feared man more than God." But the rebuke turns to mercy: he is still chosen, and will be called to the work again if he repents.

      The closing verses explain why the record matters: it is to bring a knowledge of the Savior to the descendants of the people who wrote it.
    Why it matters: |-
      The revelation shows Joseph Smith being corrected in his own scripture, and it set a pattern he kept for the rest of his life of publishing revelations that reproved him. Its opening lines are among the most quoted in the book.

  dc-13:
    Background: |-
      In May 1829 Joseph Smith and Oliver Cowdery were translating the Book of Mormon at Harmony, Pennsylvania. Passages about baptism for the remission of sins raised a question neither could answer: who had authority to baptize? On May 15 they went to the woods by the Susquehanna River to pray.
    What it says: |-
      The section is a single verse: the words John the Baptist spoke as he laid his hands on their heads.

      He confers "the Priesthood of Aaron," which holds the keys of the ministering of angels, of the gospel of repentance and of baptism by immersion for the remission of sins. He adds that it will not be taken from the earth again.
    Why it matters: |-
      Latter-day Saints understand this as the moment authority to baptize returned to the earth. The words come from Joseph Smith's history, written in 1838, and were added to the Doctrine and Covenants in 1876. Young men in the Church are still ordained to the Aaronic Priesthood named here.

  dc-20:
    Background: |-
      As the organization of the Church approached, its members needed a statement of what it believed and how it was to work. Oliver Cowdery had drafted an early version in 1829. The finished text was ready around the time of the organization in April 1830 and was approved by the first conference of the Church that June.
    What it says: |-
      The early Saints called it the "Articles and Covenants." It begins with history: the calling of Joseph Smith, the coming forth of the Book of Mormon and the witnesses to it. It then sets out basic beliefs about God, the creation, the fall, the atonement of Jesus Christ and the need to endure in faith.

      The rest is practical. It explains who may be baptized and how, with the words to be used. It describes the duties of elders, priests, teachers and deacons and of the members. It gives the prayers for blessing the bread and wine of the sacrament, and directions for conferences, membership records and the blessing of children.
    Why it matters: |-
      This was the Church's first handbook and its constitution, read aloud at early conferences and carried by missionaries. The sacrament prayers it gives are the ones used in Latter-day Saint meetings every Sunday.

  dc-21:
    Background: |-
      On April 6, 1830, a small company met in the home of Peter Whitmer Sr. at Fayette, New York, to organize the Church. Joseph Smith and Oliver Cowdery were accepted as its leaders and ordained each other elders. This revelation was received during the meeting.
    What it says: |-
      It begins with an instruction: "There shall be a record kept among you." In that record Joseph Smith is to be called "a seer, a translator, a prophet, an apostle of Jesus Christ, an elder of the church."

      The members are told to receive his words "as if from mine own mouth, in all patience and faith," with a promise that the gates of hell will not prevail against them. Oliver Cowdery is named as the one to ordain Joseph, and as the first preacher of the Church.
    Why it matters: |-
      The section defines the role of a prophet at the head of the Church on the day it began. The command to keep a record is the origin of the Church's long habit of keeping minutes, journals and histories.

  dc-25:
    Background: |-
      Emma Smith was baptized on June 28, 1830, at Colesville, New York, as a mob gathered. Joseph was arrested that evening, before she could be confirmed. July found the couple back at Harmony, poor, harassed and facing the disapproval of her family. This revelation was given for her there.
    What it says: |-
      Emma is called "an elect lady." She is to comfort and support her husband, to serve as his scribe, and to be ordained to explain the scriptures and encourage the Church. Her time is to be given "to writing, and to learning much."

      She is asked to make a selection of sacred hymns, with the words that became a favorite text of the Church: "The song of the righteous is a prayer unto me."

      She is told to lay aside the things of this world, to beware of pride and to keep her covenants. The last verse says that the counsel is meant for all.
    Why it matters: |-
      It is the only section of the Doctrine and Covenants addressed to a woman. Emma's hymnbook appeared in Kirtland a few years later. Joseph Smith read the revelation aloud when the Relief Society was organized in 1842 and said that it was fulfilled in her election as president.

  dc-37:
    Background: |-
      By December 1830 the Church had more members in Ohio than in New York, after the baptism of Sidney Rigdon and many of his congregation. Rigdon had come east to meet Joseph Smith, and the two were working on the translation of the Bible. In New York, opposition to the Church was growing.
    What it says: |-
      The section is four verses long. It tells Joseph Smith and Sidney Rigdon to stop translating until they have moved to Ohio, "because of the enemy and for your sakes." First they are to strengthen the members, especially at Colesville.

      Then comes the command for the whole Church to "assemble together at the Ohio" by the time Oliver Cowdery returns from his mission. The last verse leaves the choice with each person.
    Why it matters: |-
      This is the first command to gather in this dispensation. A fuller revelation given at a conference a few days later promised that in Ohio the Saints would receive the Lord's law and be endowed with power. Nearly all the New York members went.

  dc-42:
    Background: |-
      A revelation in New York had promised the Saints that they would receive the Lord's law once they gathered in Ohio. Joseph Smith reached Kirtland at the beginning of February 1831. On February 9, twelve elders met with him and prayed for the promise to be kept. A second part was received two weeks later.
    What it says: |-
      The elders are to go out two by two and teach the principles of the gospel from the Bible and the Book of Mormon, and only by the Spirit: "If ye receive not the Spirit ye shall not teach."

      A restatement of the commandments follows: not to kill, steal, lie, commit adultery or speak evil of a neighbor. There is counsel on caring for the sick, with the promise that those who die in the Lord "shall not taste of death, for it shall be sweet unto them."

      The center of the section is the law of consecration. Members are to consecrate their property to the bishop for the support of the poor, and receive back a stewardship sufficient for their family. The surplus goes to a storehouse.
    Why it matters: |-
      The Saints called this section "the law." It gave the young Church its rules for teaching, discipline and the care of the poor. Consecration as first practiced did not last, but the principle and the bishop's storehouse remain part of Latter-day Saint life.

  dc-57:
    Background: |-
      From the first months of the Church, revelations had spoken of a city of Zion to be built in the west, without saying where. In June 1831 Joseph Smith and other elders were sent to Missouri and told the place would be shown to them. Joseph reached Independence in mid-July after a journey of about nine hundred miles and asked when and where Zion would be built.
    What it says: |-
      The answer is direct. Missouri is "the land which I have appointed and consecrated for the gathering of the saints." Independence is "the center place," and the spot for the temple lies westward, not far from the courthouse.

      The Saints are told to buy land, as much as they can, as far as the line between settlers and Indian lands. Specific tasks follow: Sidney Gilbert is to open a store, Edward Partridge to divide the land as bishop, William W. Phelps to set up as printer, with Oliver Cowdery to help him.
    Why it matters: |-
      With this revelation Zion became a place on the map. Members began moving to Jackson County at once. Their expulsion two years later, and the hope of return, run through the rest of the Doctrine and Covenants.

  dc-76:
    Background: |-
      In the winter of 1831–32 Joseph Smith and Sidney Rigdon were revising the Bible in an upstairs room of the John Johnson home at Hiram, Ohio. Joseph later said it was plain to him that if God rewards everyone according to their deeds, "heaven" must include more kingdoms than one. On February 16, 1832, they came to John 5:29, which speaks of the resurrection of the just and of the unjust.
    What it says: |-
      As the two men pondered the verse, they saw a series of visions together. First they saw the Son at the right hand of the Father and bore their testimony, "last of all," that he lives.

      They saw the fall of Lucifer and the fate of the few who become sons of perdition. Then they saw the three kingdoms of glory. The celestial, compared to the sun, is for those who receive the testimony of Jesus and are faithful to it. The terrestrial, compared to the moon, is for honorable people who were "blinded by the craftiness of men." The telestial, compared to the stars, is for those who refused the gospel, and even its glory "surpasses all understanding."
    Why it matters: |-
      Known simply as "the Vision," this section replaced the picture of one heaven and one hell with a salvation that reaches nearly everyone. It unsettled some early members and delighted others. Joseph Smith wrote that nothing could be more pleasing to the Saints.

  dc-84:
    Background: |-
      In September 1832 elders returning to Kirtland from missions in the eastern states met with Joseph Smith to report. The revelation was received in their presence over two days, September 22 and 23.
    What it says: |-
      It begins with the New Jerusalem and a temple to be built in Missouri, then turns to the priesthood. It traces the line of authority back from Moses to Adam, explains the greater and lesser priesthoods, and teaches that in the ordinances of the priesthood "the power of godliness is manifest."

      It sets out what is called the oath and covenant of the priesthood: those who receive it and are faithful are promised all that the Father has.

      The Church is rebuked for treating the Book of Mormon lightly. The second half instructs missionaries to go without purse or scrip, with the promise, "I will go before your face. I will be on your right hand and on your left."
    Why it matters: |-
      Joseph Smith called this a revelation on priesthood, and it remains one of the main Latter-day Saint texts on the subject. Its warning about neglecting the Book of Mormon has been repeated by Church leaders ever since.

  dc-88:
    Background: |-
      At the end of 1832 the country was tense, with South Carolina threatening to leave the Union. On Christmas Day Joseph Smith received a prophecy on war. Two days later, on December 27, he met with a group of high priests in Kirtland who prayed, each in turn, to know the Lord's will. This revelation came over that day and the next, with a last portion on January 3, 1833.
    What it says: |-
      Joseph Smith sent it to the Saints in Missouri as an "olive leaf," a message of peace. It is one of the longest and most wide-ranging of the revelations.

      It describes the light of Christ, which "is in all things" and gives life to all things. It teaches about the resurrection, the kingdoms of glory and the events of the last days.

      It then turns to how the Saints should live. They are to "seek learning, even by study and also by faith," out of the best books. They are to organize a school for the elders, and to build "a house of prayer, a house of fasting, a house of faith, a house of learning, a house of glory, a house of order, a house of God."
    Why it matters: |-
      This section led directly to the School of the Prophets and to the Kirtland Temple. Its words on learning are the charter of Latter-day Saint education.

  dc-89:
    Background: |-
      In the winter of 1833 the School of the Prophets met in a small room over Newel K. Whitney's store in Kirtland. Many of the men smoked and chewed tobacco. According to Brigham Young, the state of the room, and Emma Smith's complaint at having to clean it, led Joseph Smith to ask the Lord about it. The revelation came on February 27, 1833.
    What it says: |-
      It is presented as "a Word of Wisdom," given as a greeting and not at first as a commandment, and suited to "the weakest of all saints."

      Wine and strong drink are not good, except wine for the sacrament. Tobacco "is not for the body." Hot drinks are not for the body.

      It then commends what is good: herbs and fruits in their season, grain as "the staff of life," and meat to be used sparingly.

      Those who follow it are promised health, "wisdom and great treasures of knowledge," and that they will "run and not be weary."
    Why it matters: |-
      Early Church leaders taught that "hot drinks" meant tea and coffee. The revelation was treated as counsel for decades and came to be kept as a commandment. It is today one of the best-known marks of Latter-day Saint life.

  dc-109:
    Background: |-
      The Kirtland Temple was finished in March 1836 after nearly three years of work. Joseph Smith prepared the prayer of dedication with the help of his counselors and scribes the day before the service and said it was given to him by revelation. He read it to the congregation on Sunday, March 27, 1836.
    What it says: |-
      The prayer asks the Lord to accept the house, built "through great tribulation" and out of poverty, and repeats the words of the revelation that commanded it.

      It asks that all who enter may feel the Lord's power, that those who worship there may be taught and forgiven, and that his servants may "go forth from this house armed with thy power."

      It prays for the Saints driven from their homes in Missouri, for the leaders of nations, for the gathering of scattered Israel, and for the Church and its families. It ends in praise.
    Why it matters: |-
      This was the first temple dedication of the Restoration, and its prayer became the model for the dedication of every temple since. Many who were present wrote of an outpouring of the Spirit that day.

  dc-110:
    Background: |-
      On Sunday, April 3, 1836, one week after the dedication, the Saints met again in the Kirtland Temple. After the sacrament, Joseph Smith and Oliver Cowdery went to the pulpits at the west end of the hall, lowered the curtains around them and knelt in prayer.
    What it says: |-
      They saw the Lord standing on the breastwork of the pulpit. The account describes him and gives his words: that their sins are forgiven, that he has accepted the house and that he will show himself to his people there.

      Three messengers followed, each committing keys of authority. Moses gave the keys of the gathering of Israel. Elias gave the dispensation of the gospel of Abraham. Elijah, in fulfillment of the prophecy of Malachi, gave the keys to turn the hearts of the fathers to the children and the children to the fathers.
    Why it matters: |-
      Latter-day Saints trace to this event the authority for worldwide missionary work and for temple sealings that bind families together. The account was written in Joseph Smith's journal at the time and was added to the Doctrine and Covenants in 1876.

  dc-115:
    Background: |-
      Joseph Smith arrived at Far West, Missouri, in March 1838, after leaving Kirtland under threat. The Saints in Missouri were building a new center, and questions needed settling: where the Church should gather, whether to build a temple, and what the Church should be called, since several names had been in use. The revelation was given on April 26, 1838.
    What it says: |-
      It is addressed to the leaders and members of "The Church of Jesus Christ of Latter Day Saints" and says, "For thus shall my church be called in the last days."

      The Saints are told, "Arise and shine forth, that thy light may be a standard for the nations." Gathering to Zion and her stakes is to be "for a defense, and for a refuge from the storm."

      Far West is to be built up as a holy city. A temple is to be started on July 4 and taken up again the next April 26, and the First Presidency are not to go into debt for it.
    Why it matters: |-
      This revelation gave the Church the name it bears today. Recent Church leaders have pointed to it in asking that the full name be used. The temple at Far West was begun and never built.

  dc-121:
    Background: |-
      By March 1839 Joseph Smith and his companions had been held for nearly four months in the lower room of the jail at Liberty, Missouri. Outside, some eight thousand or more Saints were being driven from the state in winter. On March 20 Joseph dictated a long letter to the Church. This section is drawn from it.
    What it says: |-
      It opens with a cry: "O God, where art thou?" How long will the Saints suffer before he acts?

      The answer follows: "My son, peace be unto thy soul; thine adversity and thine afflictions shall be but a small moment." If he endures it well, he will be lifted up. His friends still stand by him.

      The second half is about power. Many are called but few are chosen, because their hearts are set on the things of the world. The rights of the priesthood can be used only on principles of righteousness. Almost everyone who gets a little authority begins to abuse it. Influence should be held only "by persuasion, by long-suffering, by gentleness and meekness, and by love unfeigned."
    Why it matters: |-
      Written from a jail by a man with every reason for bitterness, this is the central Latter-day Saint teaching on how authority should be used. Its opening prayer has spoken to believers in every kind of trouble.

  dc-122:
    Background: |-
      This section comes from the same letter as section 121, dictated by Joseph Smith in Liberty Jail in March 1839. It continues the Lord's answer to his prayer.
    What it says: |-
      Joseph is told that the ends of the earth will ask after his name, and that the pure in heart will always seek his counsel.

      A list of trials follows, most of which he had already lived through: betrayal by friends, false accusation, being torn from his wife and children, being thrown into a pit, sentenced to death. If all this should come, and worse, "know thou, my son, that all these things shall give thee experience, and shall be for thy good."

      Then the question that ends the argument: "The Son of Man hath descended below them all. Art thou greater than he?" Joseph is told to hold on his way; his days are known and will not be cut short.
    Why it matters: |-
      In nine verses the section gives the Latter-day Saint answer to suffering: it is not meaningless, and Christ has gone lower than anyone. It is one of the passages members turn to most in grief.

  dc-123:
    Background: |-
      This is the third section taken from the letter Joseph Smith wrote to the Church from Liberty Jail in March 1839. As he wrote, the Saints were scattered along the road to Illinois, having lost their homes and land.
    What it says: |-
      Joseph asks the Saints to gather the facts of what they suffered: the property they lost, the injuries done to them, and the names of those responsible. They should also collect what had been published against them. The record is to be presented to the government and published to the world.

      He calls this "an imperative duty" owed to God, to their families and to the next generation, and to the many good people who are kept from the truth only "because they know not where to find it."

      It ends with encouragement. A very large ship is steered by a very small helm. "Let us cheerfully do all things that lie in our power; and then may we stand still, with the utmost assurance, to see the salvation of God."
    Why it matters: |-
      The Saints did as he asked. Hundreds of sworn statements were written in 1839 and 1840, and Joseph Smith carried them to Washington to seek redress, without success. They survive as one of the main records of the Missouri persecutions.

  dc-124:
    Background: |-
      By January 1841 the Saints had been in Illinois nearly two years. Nauvoo had just received its city charter and was growing fast, but the Church had not been fully reorganized since Missouri. Joseph Smith's father, the Patriarch, had died, and so had Bishop Edward Partridge and the apostle David W. Patten. This revelation was received on January 19, 1841.
    What it says: |-
      It is the longest revelation of the Nauvoo period. Joseph Smith is told to write a proclamation of the gospel to the rulers of the world.

      The Saints are commanded to build a temple, "for there is not a place found on earth" where the fulness of the priesthood can be restored. Baptism for the dead belongs in a temple, and will be accepted elsewhere only while they are too poor to build one.

      They are also to build the Nauvoo House, a hotel where travellers can learn about the Church. Those who have died are remembered by name. Hyrum Smith is called as Patriarch and to stand beside his brother, and the officers of every quorum are listed.
    Why it matters: |-
      This revelation set the agenda for Nauvoo: the temple above all. It also set the Church in order after the losses of Missouri, and raised Hyrum Smith to the place he held until he died with Joseph.

  dc-128:
    Background: |-
      In the late summer of 1842 Joseph Smith was in hiding near Nauvoo to avoid being taken to Missouri on a false charge. Baptisms for the dead had been performed for two years, joyfully and without much order. He wrote a short letter about keeping records on September 1 (now section 127), and this longer one a few days later.
    What it says: |-
      The first part is practical. Each baptism for the dead needs a recorder who is an eyewitness, and the records must be gathered into a general book. This matters because of the promise that what is bound and recorded on earth is bound and recorded in heaven.

      Joseph then explains the ordinance. The font is a likeness of the grave. The living and the dead need one another: "they without us cannot be made perfect—neither can we without our dead be made perfect." He calls it a "welding link" between the generations.

      The letter closes in rejoicing: "Now, what do we hear in the gospel which we have received? A voice of gladness!" He recalls the messengers who restored their keys and urges the Saints on: "Shall we not go on in so great a cause?"
    Why it matters: |-
      This is Joseph Smith's fullest written explanation of ordinances for the dead. The careful record keeping it requires grew into the Church's worldwide family history work.

  dc-135:
    Background: |-
      Joseph and Hyrum Smith were killed by a mob at Carthage Jail on June 27, 1844. The Doctrine and Covenants was being reprinted in Nauvoo at the time, and this account was added at the end of the new edition, which came out that autumn. It has traditionally been attributed to John Taylor, who was wounded in the attack.
    What it says: |-
      It announces the martyrdom and gives the facts: the day and hour, the mob "painted black," the last words of each man.

      It then sums up Joseph Smith's life. In twenty years he brought out the Book of Mormon, sent the gospel to the corners of the earth, gathered thousands of Saints and built a city. It makes the claim that he "has done more, save Jesus only, for the salvation of men in this world, than any other man that ever lived in it."

      It records his words on the road to Carthage, "I am going like a lamb to the slaughter; but I am calm as a summer's morning," and the passage Hyrum read in the Book of Mormon before they left. The brothers "were not divided" in life or in death.
    Why it matters: |-
      This is the Church's own memorial to its founder, written within weeks of his death. It is a tribute and not a revelation, and it fixed the way Latter-day Saints have remembered the martyrdom.

  dc-136:
    Background: |-
      In January 1847 thousands of Latter-day Saints were camped at Winter Quarters and across Iowa after being forced from Nauvoo. The crossing of Iowa had been slow and disorganized, and many were dying. Brigham Young and the Twelve were planning the journey to the Rocky Mountains. This revelation was given through Brigham Young on January 14.
    What it says: |-
      It calls itself "the Word and Will of the Lord concerning the Camp of Israel." The Saints are to be organized into companies under captains of hundreds, fifties and tens, with a president and two counselors over each, all directed by the Twelve.

      Each company is to carry its share of the poor, the widows, the fatherless and the families of the men away in the army, and to prepare houses and fields for those who will follow.

      It gives rules for living together on the road: be honest, return what is borrowed, do not be drunk, do not speak evil. "If thou art merry, praise the Lord with singing, with music, with dancing, and with a prayer of praise and thanksgiving. If thou art sorrowful, call on the Lord thy God."

      It ends by speaking of Joseph Smith, whose death was needed "that he might be honored and the wicked might be condemned."
    Why it matters: |-
      This is the only section in the Doctrine and Covenants that came through Brigham Young. It turned a refugee camp into an organized people, and its pattern of companies was used for more than twenty years of migration.
