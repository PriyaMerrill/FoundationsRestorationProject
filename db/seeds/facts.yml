# Short "at a glance" facts shown on record pages, keyed by each record's slug.
#
# Where they come from:
#   people      - Wikidata (wikidata.org), checked against the opening of each
#                 person's Wikipedia article. Wikidata's lists of spouses,
#                 children and offices are incomplete, so those are left out.
#   places      - Wikidata: the county and the historic site that stands there now.
#   revelations - the heading of each section of the Doctrine and Covenants,
#                 put into this site's own words.
#
# DRAFT: check against the Church's own records before launch.

