revelations:
  dc-3:
    - { label: "Kind", value: "Revelation" }
    - { label: "Given to", value: "Joseph Smith" }
    - { label: "Occasion", value: "After Martin Harris lost the first 116 pages of the Book of Mormon manuscript" }
  dc-13:
    - { label: "Kind", value: "The words of John the Baptist, from Joseph Smith’s history" }
    - { label: "Given to", value: "Joseph Smith and Oliver Cowdery" }
    - { label: "Occasion", value: "Their ordination to the Aaronic Priesthood" }
  dc-20:
    - { label: "Kind", value: "Revelation on Church organization and government" }
    - { label: "Given through", value: "Joseph Smith" }
    - { label: "Known then as", value: "The Articles and Covenants" }
    - { label: "Occasion", value: "Recorded soon after the Church was organized on April 6, 1830; parts may date from the summer of 1829" }
  dc-21:
    - { label: "Kind", value: "Revelation" }
    - { label: "Given to", value: "Joseph Smith" }
    - { label: "Occasion", value: "The meeting at which the Church was organized, in the home of Peter Whitmer Sr." }
  dc-25:
    - { label: "Kind", value: "Revelation" }
    - { label: "Given through", value: "Joseph Smith" }
    - { label: "Addressed to", value: "Emma Smith" }
  dc-37:
    - { label: "Kind", value: "Revelation" }
    - { label: "Given to", value: "Joseph Smith and Sidney Rigdon" }
    - { label: "Occasion", value: "The first commandment for the Church to gather" }
  dc-42:
    - { label: "Kind", value: "Revelation, in two parts" }
    - { label: "Given through", value: "Joseph Smith" }
    - { label: "Received", value: "February 9 and February 23, 1831" }
    - { label: "Occasion", value: "The first part came in the presence of twelve elders, fulfilling a promise that the law would be given in Ohio" }
  dc-57:
    - { label: "Kind", value: "Revelation" }
    - { label: "Given through", value: "Joseph Smith" }
    - { label: "Occasion", value: "The elders had travelled from Ohio to Missouri’s western border, and Joseph asked where Zion would be built and where its temple would stand" }
  dc-76:
    - { label: "Kind", value: "Vision" }
    - { label: "Given to", value: "Joseph Smith and Sidney Rigdon" }
    - { label: "Occasion", value: "While they worked on the translation of the Bible, after returning from a conference at Amherst" }
  dc-84:
    - { label: "Kind", value: "Revelation on priesthood" }
    - { label: "Given through", value: "Joseph Smith" }
    - { label: "Received", value: "September 22 and 23, 1832" }
    - { label: "Occasion", value: "Elders had returned from missions in the eastern states and were reporting on their work" }
  dc-88:
    - { label: "Kind", value: "Revelation, called the “olive leaf”" }
    - { label: "Given through", value: "Joseph Smith" }
    - { label: "Received", value: "December 27 and 28, 1832, and January 3, 1833" }
    - { label: "Occasion", value: "High priests at a conference had prayed to know the Lord’s will about building up Zion" }
  dc-89:
    - { label: "Kind", value: "Revelation, known as the Word of Wisdom" }
    - { label: "Given through", value: "Joseph Smith" }
    - { label: "Occasion", value: "Joseph asked about the use of tobacco in the brethren’s meetings, which had troubled Emma Smith" }
  dc-109:
    - { label: "Kind", value: "Prayer" }
    - { label: "Offered by", value: "Joseph Smith" }
    - { label: "Occasion", value: "The dedication of the Kirtland Temple; the prayer was prepared by revelation the night before" }
  dc-110:
    - { label: "Kind", value: "Visions" }
    - { label: "Given to", value: "Joseph Smith and Oliver Cowdery" }
    - { label: "Occasion", value: "A Sabbath meeting in the Kirtland Temple on Easter Sunday, after the sacrament" }
  dc-115:
    - { label: "Kind", value: "Revelation" }
    - { label: "Given through", value: "Joseph Smith" }
    - { label: "Occasion", value: "It names the Church and approves Far West as a gathering place" }
  dc-121:
    - { label: "Kind", value: "A prayer and prophecies, from two letters to the Church" }
    - { label: "Written by", value: "Joseph Smith" }
    - { label: "Written", value: "The first letter is dated March 20, 1839; the second was composed about March 22" }
    - { label: "Occasion", value: "After months in Liberty Jail, when appeals to government officials had failed" }
  dc-122:
    - { label: "Kind", value: "Part of a letter to the Church" }
    - { label: "Written by", value: "Joseph Smith" }
    - { label: "Written", value: "About March 22, 1839, in Liberty Jail" }
  dc-123:
    - { label: "Kind", value: "Part of a letter to the Church" }
    - { label: "Written by", value: "Joseph Smith" }
    - { label: "Written", value: "About March 22, 1839, in Liberty Jail" }
    - { label: "Subject", value: "The Saints’ duty in relation to those who persecuted them" }
  dc-124:
    - { label: "Kind", value: "Revelation" }
    - { label: "Given to", value: "Joseph Smith" }
    - { label: "Occasion", value: "The Saints, forced from Missouri, had built Nauvoo on the site of the village of Commerce" }
  dc-128:
    - { label: "Kind", value: "Letter" }
    - { label: "Written by", value: "Joseph Smith, to the Church" }
    - { label: "Dated", value: "September 7, 1842, at Nauvoo" }
    - { label: "Subject", value: "Further directions on baptism for the dead" }
  dc-135:
    - { label: "Kind", value: "Announcement" }
    - { label: "Subject", value: "The martyrdom of Joseph and Hyrum Smith at Carthage, Illinois, on June 27, 1844" }
    - { label: "First published", value: "At the end of the 1844 edition of the Doctrine and Covenants, which was nearly ready when they were killed" }
  dc-136:
    - { label: "Kind", value: "Revelation, “the word and will of the Lord”" }
    - { label: "Given through", value: "Brigham Young" }
    - { label: "Where", value: "Winter Quarters, on the west bank of the Missouri River" }
